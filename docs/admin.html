<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber Dashboard</title>
<link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Barber"><meta name="theme-color" content="#1f3864"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0f0f11;--card:#1c1c20;--ink:#f3f3f5;--mute:#9a9aa3;--line:#2e2e34;--pri:#f3f3f5;--pri-ink:#0f0f11;--ok:#d4d4d8;--warn:#a3a3ab;--err:#e5484d;--y:#26262b;--soft:#141417}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Sarabun,Roboto,sans-serif;padding-bottom:72px}
.top{background:#000;color:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.top b{font-size:17px}.top small{opacity:.8}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}h2{font-size:15px;margin:0 0 8px;color:var(--ink);letter-spacing:.3px}.mute{color:var(--mute);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.tile b{display:block;font-size:18px}.tile small{color:var(--mute);font-size:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:13px;color:var(--mute)}.nav button.on{color:var(--pri);font-weight:700}.nav button span{display:block;font-size:22px}
.sub{display:flex;gap:6px;margin:0 0 10px;position:sticky;top:50px;z-index:4;background:var(--bg);padding:4px 0}.sub button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:20px;padding:8px 4px;font-size:14px;font-weight:600}.sub button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.alert{border:1px solid #6b5b2a;background:#2a2412;border-radius:12px;padding:10px 12px;margin-bottom:10px}.alert h2{color:#f2c14e}.alert .al{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #3d351c;font-size:14px}.alert .al:last-child{border:0}.alert .al button{margin:0;padding:5px 10px;font-size:13px}.alert.none{border-color:var(--line);background:var(--card)}.alert.none h2{color:var(--ok)}
.mtd{margin:6px 0}.mtd .srow{grid-template-columns:70px 1fr 90px}.mtd b{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}td:first-child,th:first-child{text-align:left}th{color:var(--mute);font-weight:600;font-size:12px}tr.sum td{font-weight:700;background:var(--soft)}
input,select,textarea{width:100%;border:1px solid #3a3a41;border-radius:9px;padding:9px;font-size:15px;background:var(--soft);color:var(--ink)}label{font-size:12px;color:var(--mute);display:block;margin-top:8px}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;color:var(--pri-ink);background:var(--pri);cursor:pointer;margin-top:8px}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.err{background:var(--err);color:#fff}.btn.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn.w{width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}.msg{border-radius:9px;padding:9px 12px;margin-top:8px;font-size:13.5px;display:none}.msg.ok{background:#2a2a30;color:#e5e5ea;border:1px solid #4a4a52}.msg.err{background:#3a1d1f;color:#ffb3b6}.msg.warn{background:#2a2a30;color:#d4d4d8}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:8px 4px;font-size:14px;font-weight:600}.seg button.on{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.hide{display:none}.pill{display:inline-block;background:#2a2a30;color:var(--ink);border:1px solid #4a4a52;border-radius:20px;padding:2px 8px;font-size:12px;margin:2px}.pill.late{background:#3a3a41;color:#d4d4d8}.pill.no{background:#3a1d1f;color:#ffb3b6}
.grid td input{width:60px;padding:6px;text-align:right;font-size:14px}.grid td input.tot{border:0;background:transparent;font-weight:700;width:64px;padding:6px 2px}.grid td input.wide{width:80px}.grid td.n{text-align:left;font-weight:600}
.att{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.1fr;column-gap:8px;align-items:stretch;font-size:13.5px}.att>div{padding:7px 0;border-bottom:1px solid var(--line);text-align:left;display:flex;align-items:center;line-height:1.3}.att>div>div{display:block;white-space:nowrap}.att>div>div b{font-size:15px}.att .hd{color:var(--mute);font-size:12px;font-weight:600}.att .shop{grid-column:1/-1;font-weight:700;padding:8px 0 2px;border:0;color:var(--mute);font-size:12.5px;letter-spacing:.3px}.att .nm{font-weight:600}
.dl{border-bottom:1px solid var(--line);padding:10px 0}.dlh{margin-bottom:6px;display:flex;align-items:center;gap:6px}.srow{display:grid;grid-template-columns:minmax(80px,40%) 1fr 28px;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}.sbar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.sbar i{display:block;height:100%;background:#e8e8ea;border-radius:4px}.srow b{text-align:right}.ncard{margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px}.nrow{display:flex;justify-content:space-between;margin-bottom:6px}.nck{margin-top:4px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04)}.nck.ok{background:rgba(60,170,90,.15)}.nck.bad{background:rgba(220,60,60,.18)}.npre{white-space:pre-wrap;font-family:inherit;font-size:13px;margin:6px 0 0;opacity:.85}details summary{margin-top:6px;cursor:pointer;font-size:12.5px}.bkbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-size:14px;font-weight:600}.bkbar .mute{font-weight:400;font-size:12.5px}.bkbar.none{opacity:.5;border-style:dashed;font-weight:400}.bkimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-top:6px}.dlg{display:grid;grid-template-columns:.7fr 1fr 1fr 1fr;gap:6px}.dlg label,.dlf label{margin:0;font-size:11.5px}.dlg input{padding:8px 6px;text-align:right;margin-top:2px}.dlg input.tot{border:0;background:transparent;font-weight:700;font-size:16px;padding:8px 2px}.dlf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}.dlf label{display:flex;align-items:center;gap:6px}.dlf input{width:90px;padding:6px;text-align:right}
.slp{margin-top:6px;font-size:12.5px;padding:6px 8px;border-radius:8px;cursor:pointer}.slp:empty{display:none}.slp.ok{background:#1f2a22;color:#b7e4c0}.slp.bad{background:#3a1d1f;color:#ffb3b6}.slp.warn{background:#2a2a30;color:#e5e5ea}.slp.wait{background:#3a2e12;color:#f2c14e}.slp.tck{cursor:default}
.login{text-align:center;padding:40px 16px}.login .btn{background:#06c755;color:#fff}
.scroll{overflow-x:auto}.bar{height:8px;background:#2e2e34;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:9}.modal .card{width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;margin:0}.x{float:right;background:none;border:0;font-size:22px;color:var(--mute)}
.chip.pick{position:relative;overflow:hidden}.chip.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:20px;padding:5px 12px;font-size:13px}.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.addb{display:flex;gap:8px;align-items:center;margin:8px 0}.addb select{flex:1}.addb .btn{margin-top:0;flex:0 0 auto}
.qg{display:grid;position:relative;column-gap:4px}.qh{grid-row:1;text-align:center;font-weight:700;font-size:13px;line-height:1.1}.qh small{display:block;font-weight:400;color:var(--mute);font-size:10.5px}
.qt{grid-column:1;font-size:11px;color:var(--mute);border-top:1px solid var(--line);padding-top:1px}.qc{border-top:1px dotted #26262b;cursor:pointer}.qc.hr{border-top:1px solid var(--line)}.qc:active{background:#2a2a30}
.qb{z-index:2;margin:1px 0;background:#e9e9ee;color:#0f0f11;border-radius:7px;padding:2px 5px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;box-shadow:0 1px 0 #000}.qb.done{background:#b7e4c0}.qb.no{background:#3a1d1f;color:#ffb3b6;text-decoration:line-through}.qb.self{outline:2px dashed #9a9aa3;outline-offset:-2px}
.qoff{z-index:2;background:repeating-linear-gradient(45deg,#1a1a1e,#1a1a1e 6px,#222227 6px,#222227 12px);border-radius:8px;color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}
/* กฎ UI: ปุ่มตัดสินใจ/ตัวเลือก สีเท่ากันก่อน → กดเลือกตัวไหนค่อยเข้ม */
.btn.sec:active,.btn.sec.on{background:var(--pri)!important;color:var(--pri-ink)!important;border-color:var(--pri)!important}.seg button:active,.chip:active{background:var(--pri);color:var(--pri-ink)}
.tg{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;font-weight:600}.tg.give{background:#1f3a26;color:#9fe0ae}.tg.adv{background:#3a2e12;color:#f2c14e}
.chb{margin-top:6px}.chbt{border:1px solid var(--line);background:var(--soft);color:var(--mute);border-radius:8px;padding:5px 10px;font-size:13px}.chbt.on{color:var(--ink)}.chf{margin-top:6px;padding:8px;border:1px dashed var(--line);border-radius:10px}.dlg.c2{grid-template-columns:1fr 1fr}.chf input{text-align:right}.chf>label input{max-width:120px;display:block}.chm{font-size:12.5px;margin-top:6px}.chm.bad{color:var(--err)}.pcard h2{margin:0}.pdr{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.pdg{display:grid;grid-template-columns:1fr 1.5fr .55fr .9fr;gap:6px}.pdg label{margin:0;font-size:11.5px}.pdg input,.pdg select{padding:7px 6px;margin-top:2px}.pdg .pq,.pdg .pa{text-align:right}.pdg .po{margin-top:4px}#pdCom .slp{margin-top:6px}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="config.js"></script></head>
<body ontouchstart="">
<div class="top"><div><b>✂️ Barber Dashboard</b><br><small id="me"></small></div><button class="btn sec" style="margin:0;padding:6px 10px;font-size:13px;border-color:#fff;color:#fff;background:none" onclick="reload()">⟳</button></div>
<div class="wrap">
  <div id="loginBox" class="login card hide"><div style="font-size:40px">✂️</div><h2>Barber Back Office</h2><div class="mute">ล็อกอินด้วย LINE ครั้งเดียว เครื่องนี้จะจำไว้ 90 วัน</div><button class="btn w" onclick="lineLogin()">ล็อกอินด้วย LINE</button><div id="loginMsg" class="msg"></div></div>
  <div id="loading" class="card mute">กำลังโหลด…</div>
  <div id="subbar" class="sub hide"></div>
  <div id="pg_today" class="pg hide"></div>
  <div id="pg_q" class="pg hide"></div>
  <div id="pg_lv" class="pg hide"></div>
  <div id="pg_daily" class="pg hide"></div>
  <div id="pg_exp" class="pg hide"></div>
  <div id="pg_pond" class="pg hide"></div>
  <div id="pg_month" class="pg hide"></div>
  <div id="pg_pay" class="pg hide"></div>
  <div id="pg_set" class="pg hide"></div>
  <div id="gmsg" class="msg"></div>
</div>
<!-- 4 แท็บหลัก · แท็บย่อยอยู่ใน #subbar -->
<div class="nav" id="nav">
  <button data-g="home" onclick="goG('home')"><span>🏠</span>หน้าแรก</button>
  <button data-g="q" onclick="goG('q')"><span>📅</span>คิว</button>
  <button data-g="rec" onclick="goG('rec')"><span>✏️</span>บันทึก</button>
  <button data-g="rep" onclick="goG('rep')"><span>📊</span>รายงาน</button>
</div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="modal" id="dlg" style="align-items:center"><div class="card" style="width:92%;max-width:360px;border-radius:16px;margin:0"><h2 id="dlgT"></h2><div id="dlgM" style="white-space:pre-line;margin-bottom:8px"></div><input id="dlgI" style="display:none" onkeydown="if(event.key==='Enter')dlgEnd(true)"><div class="row" style="margin-top:12px"><button class="btn sec" id="dlgNo" onclick="dlgEnd(false)">ยกเลิก</button><button class="btn sec" id="dlgOk" onclick="dlgEnd(true)">ตกลง</button></div></div></div>
<script>
const $=id=>document.getElementById(id); const GAS=BBO.GAS_URL; let ADT=localStorage.getItem('bbo_adt')||'', ME=null, INIT=null, PAGE='today', TODAY=todayStr();
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function n(v){ return (Number(v)||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function msg(id,t,c){ const m=$(id); m.textContent=t; m.className='msg '+c; m.style.display=t?'block':'none'; }
async function api(p){ p.adt=ADT; const r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)}); const j=await r.json(); if(j.expired){ localStorage.removeItem('bbo_adt'); ADT=''; showLogin('หมดอายุ กรุณาล็อกอินใหม่'); throw new Error('expired'); } return j; }
function showLogin(m){ $('loading').classList.add('hide'); $('loginBox').classList.remove('hide'); document.querySelectorAll('.pg').forEach(e=>e.classList.add('hide')); if(m) msg('loginMsg',m,'warn'); }
async function lineLogin(){ try{ await liff.init({liffId:BBO.LIFF_ID}); if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href.split('#')[0]}); return; } const idt=liff.getIDToken(); const r=await api({api:'adt',idt,lb:navigator.userAgent.slice(0,40)}); if(!r.ok){ msg('loginMsg',r.msg,'err'); try{liff.logout();}catch(e){} return; } ADT=r.adt; localStorage.setItem('bbo_adt',ADT); boot(); }catch(e){ msg('loginMsg','ล็อกอินไม่สำเร็จ: '+e.message,'err'); } }
async function boot(){
  if(/PASTE/.test(GAS)){ showLogin('ยังไม่ได้ตั้ง GAS_URL ใน config.js'); return; }
  if(/ Line\//i.test(navigator.userAgent)){ $('loading').classList.add('hide'); $('loginBox').classList.remove('hide'); $('loginBox').innerHTML='<div style="font-size:40px">✂️</div><h2>เปิดในเบราว์เซอร์ปกติ</h2><div class="mute">หน้านี้ใช้ในเบราว์เซอร์ของ LINE ไม่ได้ — กด ⋯ หรือ ↗ มุมขวาบน แล้วเลือก "เปิดในเบราว์เซอร์" (Safari/Chrome) หรือพิมพ์ลิงก์นี้ในเบราว์เซอร์</div><input readonly value="'+location.origin+location.pathname+'" onclick="this.select()" style="margin-top:10px;text-align:center">'; return; }
  $('loginBox').classList.add('hide'); $('loading').classList.remove('hide');
  if(!ADT){ try{ await liff.init({liffId:BBO.LIFF_ID}); if(liff.isLoggedIn()) return lineLogin(); }catch(e){} showLogin(''); return; }
  // แสดงข้อมูลล่าสุดที่จำไว้ก่อน (ทันที) แล้วค่อยโหลดใหม่เบื้องหลัง
  let cached=null; try{ cached=JSON.parse(localStorage.getItem('bbo_init')||'null'); }catch(e){}
  const first=location.hash.slice(1)||'today';
  if(cached&&cached.ok){ INIT=cached; ME=INIT.me; $('me').textContent=(ME.role==='owner'?'Owner':'Manager')+' · กำลังอัปเดต…'; $('loading').classList.add('hide'); if(first==='today'&&INIT.today&&INIT.today.date===TODAY){ const el=$('pg_today'); renderToday(el,INIT.today); el.dataset.loaded=1; } go(first); }
  let r; try{ r=await api({api:'init',withToday:true,date:TODAY}); }catch(e){ if(!cached) showLogin('เชื่อมต่อไม่ได้ ลองใหม่'); return; }
  if(!r.ok){ showLogin(r.msg||''); return; }
  INIT=r; ME=INIT.me; try{ localStorage.setItem('bbo_init',JSON.stringify(INIT)); }catch(e){}
  $('me').textContent=ME.role==='owner'?'Owner':'Manager'; $('loading').classList.add('hide');
  if(INIT.today){ const el=$('pg_today'); renderToday(el,INIT.today); el.dataset.loaded=1; }
  if(!cached) go(first);
  setTimeout(prefetch,800);
}
function reload(){ go(PAGE,true); }
const LOADERS={today:pToday,q:pQueue,lv:pQueue,daily:pDaily,exp:pExp,pond:pPond,month:pMonth,pay:pPay,set:pSet};
/* กลุ่มแท็บ → หน้าย่อย (ชื่อแท็บย่อยใช้คำเดียวกันทุกที่) */
const GROUPS={home:[['today','หน้าแรก']],q:[['q','📅 ตารางคิว'],['lv','🏖️ ลา / ย้ายร้าน']],rec:[['daily','✏️ กรอกยอด'],['exp','🧾 รายจ่าย'],['pond','💵 เงิน']],rep:[['month','📊 รายเดือน'],['pay','💰 เงินเดือน'],['set','⚙️ ตั้งค่า']]};
const LAST={}; // หน้าย่อยล่าสุดของแต่ละกลุ่ม
function groupOf(p){ return Object.keys(GROUPS).find(g=>GROUPS[g].some(x=>x[0]===p))||'home'; }
function goG(g){ go(LAST[g]||GROUPS[g][0][0]); }
function subbar(p){ const g=groupOf(p); LAST[g]=p; const sb=$('subbar'); if(GROUPS[g].length<2){ sb.classList.add('hide'); sb.innerHTML=''; return; } sb.classList.remove('hide'); sb.innerHTML=GROUPS[g].map(([k,l])=>'<button class="'+(k===p?'on':'')+'" onclick="go(\''+k+'\')">'+l+'</button>').join(''); document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.g===g)); }
/* โหลดหน้าอื่นล่วงหน้า "ทีละ 2 หน้า" (เดิมยิงพร้อมกัน 8 หน้า → Apps Script ช้าทั้งระบบ) · หน้าที่ user กำลังกดจะได้คิวก่อน */
const PRE_ORDER=['q','daily','pond','month','exp','pay','set'];
async function prefetch(){ const queue=PRE_ORDER.filter(p=>p!==PAGE); const worker=async()=>{ while(queue.length){ const p=(queue.includes(PAGE)?queue.splice(queue.indexOf(PAGE),1):queue.splice(0,1))[0]; const el=$('pg_'+p); if(el.dataset.loaded||el.dataset.busy) continue; el.dataset.busy=1; if(!el.innerHTML) el.innerHTML='<div class="card mute">กำลังโหลด…</div>'; try{ await LOADERS[p](el); el.dataset.loaded=1; }catch(e){} delete el.dataset.busy; } }; await Promise.all([worker(),worker()]); }
function go(p,force){ if(!INIT) return; if(!LOADERS[p]) p='today'; PAGE=p; location.hash=p; subbar(p); document.querySelectorAll('.pg').forEach(e=>e.classList.add('hide')); const el=$('pg_'+p); el.classList.remove('hide'); if(el.dataset.busy&&!force){ const t0=Date.now(); const w=setInterval(()=>{ if(el.dataset.loaded||PAGE!==p){ clearInterval(w); } else if(Date.now()-t0>6000){ clearInterval(w); go(p,true); } },500); return; } if(force||!el.dataset.loaded){ el.innerHTML='<div class="card mute">กำลังโหลด…</div>'; LOADERS[p](el).then(()=>el.dataset.loaded=1).catch(e=>{ if(e.message!=='expired') el.innerHTML='<div class="card msg err" style="display:block">โหลดไม่ได้: '+esc(e.message)+'</div>'; }); } }
/* dialog ของแอปเอง (prompt/confirm/alert ใช้ไม่ได้ในแอปที่เพิ่มไว้หน้าจอโฮม iOS) */
let _dlg=null;
function ask(o){ return new Promise(res=>{ _dlg=res; const d=$('dlg'); $('dlgT').textContent=o.title||''; $('dlgM').textContent=o.text||''; const inp=$('dlgI'); inp.style.display=o.input?'block':'none'; inp.value=o.def||''; inp.inputMode=o.numeric?'numeric':'text'; $('dlgOk').textContent=o.ok||'ตกลง'; $('dlgNo').style.display=o.noCancel?'none':'inline-block'; d.style.display='flex'; if(o.input) setTimeout(()=>inp.focus(),100); }); }
function dlgEnd(ok){ $('dlg').style.display='none'; const r=_dlg; _dlg=null; if(r) r(ok?($('dlgI').style.display==='none'?true:$('dlgI').value):null); }
const confirmA=(text,title)=>ask({title:title||'ยืนยัน',text,ok:'ยืนยัน'}); const promptA=(title,def,numeric)=>ask({title,input:true,def,numeric,ok:'บันทึก'}); const alertA=(text)=>ask({title:'แจ้งเตือน',text,noCancel:true});
function modal(h){ $('modalBody').innerHTML='<button class="x" onclick="closeModal()">×</button>'+h; $('modal').style.display='flex'; } function closeModal(){ $('modal').style.display='none'; }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ const s=Math.min(1,1280/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.85)); }; img.onerror=rej; img.src=url; }); }
const monthSel=(id,cur,fn)=>'<select id="'+id+'" onchange="'+fn+'">'+INIT.months.map(m=>'<option'+(m===cur?' selected':'')+'>'+m+'</option>').join('')+'</select>';
const shopSel=(id,cur)=>'<select id="'+id+'">'+INIT.shops.map(s=>'<option'+(s===cur?' selected':'')+'>'+s+'</option>').join('')+'</select>';

/* ---------- วันนี้ ---------- */
async function pToday(el,date){ const d=await api({api:'today',date:date||TODAY}); if(!d.ok) throw new Error(d.msg); renderToday(el,d); }
function renderToday(el,d){
  if(d.home) HM=d.home; const own=ME.role==='owner';
  let h='<div class="card"><div class="row"><div><h2>🏠 '+d.date+'</h2></div><div><input type="date" value="'+d.date+'" onchange="pToday($(\'pg_today\'),this.value)"></div></div>';
  h+='<div class="tiles">'+d.byShop.map(s=>'<div class="tile"><small>'+s.shop+'</small><b>'+s.heads+' หัว</b><small>'+n(s.sales)+' บ. · ค่าแรง '+n(s.wage)+'</small></div>').join('')+'</div>';
  // เดือนนี้ vs เป้า
  if((d.mtd||[]).length) h+='<div class="mtd">'+d.mtd.map(m=>{const pc=m.target?Math.min(100,Math.round(m.heads*100/m.target)):0;return '<div class="srow"><span>'+esc(m.shop)+'</span><span class="sbar"><i style="width:'+pc+'%'+(m.target&&m.heads>=m.target?';background:#b7e4c0':'')+'"></i></span><b>'+m.heads+(m.target?' / '+m.target+(m.heads>=m.target?' ✓':''):' <span class="mute">ไม่มีเป้า</span>')+'</b></div>';}).join('')+'<div class="mute">หัวเดือนนี้ / เป้า · ยอดเดือนนี้ '+n(d.mtd.reduce((a,m)=>a+m.sales,0))+' บ.</div></div>';
  h+='</div>';
  // กล่องเตือน — รวมทุกอย่างที่ต้องทำ/ผิดปกติ ไว้ที่เดียว
  const A=[]; (d.alerts||[]).filter(a=>!a.own||ME.role==='owner').forEach(a=>A.push(a));
  (d.pond||[]).forEach(p=>{ if(p.due) A.push({t:'💸 '+p.name+' ค้างโอน '+p.due+' วัน '+n(p.dueTotal)+' บ.',go:'pond',b:'ไปโอน'}); });
  if(d.bank&&d.bank.float!=null){ (d.bank.diffM||[]).slice(0,2).forEach(m=>A.push({t:'🏦 เงินเข้าบัญชี …'+esc(m.acct)+' '+ymTh(m.ym)+' ไม่ตรง: จริง '+n(m.act)+' / ระบบ '+n(m.exp)+' ('+sg(m.diff)+')',go:'pond',b:'ดู'})); if(ME.role==='owner'){ (d.bank.missM||[]).slice(0,1).forEach(k=>A.push({t:'🏦 ยังไม่กรอกเงินเข้าบัญชีจริง '+ymTh(k),go:'pond',b:'กรอก'})); const lw=d.bank.low||700; if(d.bank.balance!=null&&d.bank.balance<lw) A.push({t:'💼 วงเงินสำรองผู้จัดการเหลือ '+n(d.bank.balance)+' บ. (ต่ำกว่า '+n(lw)+')',go:'pond',b:'เติม'}); } }
  if(d.bank&&d.bank.check&&d.bank.check.diff) A.push({t:(d.bank.float!=null?'💼 วงเงินสำรอง':'🏦 บัญชีผู้จัดการ')+' ส่วนต่าง '+(d.bank.check.diff>0?'+':'')+n(d.bank.check.diff)+' ('+d.bank.check.d.slice(5)+')',go:'pond',b:'ดู'});
  if(d.date===TODAY&&d.notYet.length&&new Date().getHours()>=12) A.push({t:'⏰ ยังไม่กดเข้างาน: '+d.notYet.join(', ')});
  h+='<div class="alert'+(A.length?'':' none')+'"><h2>'+(A.length?'⚠️ ต้องดู ('+A.length+')':'✓ ไม่มีอะไรค้าง')+'</h2>'+A.map(a=>'<div class="al"><span>'+a.t+'</span>'+(a.go?'<button class="btn sec" onclick="'+(a.d&&a.shop?'goDaily(\''+a.d+'\',\''+esc(a.shop)+'\')':'go(\''+a.go+'\')')+'">'+(a.b||'ดู')+'</button>':'')+'</div>').join('')+'</div>';
  // เข้างาน
  const dm=v=>v===null?'<span class="mute">ไม่มี GPS</span>':(v===''||v==null)?'':'<span class="mute">'+v+' ม.</span>';
  h+='<div class="card"><h2>👥 เข้างาน</h2><div class="att"><div class="hd">ช่าง</div><div class="hd">เข้า</div><div class="hd">ออก</div><div class="hd">หมายเหตุ</div>'+d.byShop.map(s=>'<div class="shop">'+s.shop+'</div>'+(s.staff.length?s.staff.map(x=>'<div class="nm">'+x.name+'</div><div>'+(x.tin?'<div><b>'+x.tin+'</b><br>'+dm(x.distIn)+'</div>':'<span class="pill'+(x.status==='ลา'?'':' late')+'">'+(x.status==='ลา'?'🏖️ ลา':x.status==='รออนุมัติลา'?'⏳ ขอลา':esc(x.status||'—'))+'</span>')+'</div><div>'+(x.tout?'<div><b>'+x.tout+'</b><br>'+dm(x.distOut)+'</div>':'<span class="mute">—</span>')+'</div><div>'+(x.late>0?'<span class="pill late">สาย '+x.late+' น.</span>':'')+(x.distIn!==''&&x.distIn!==null&&x.distIn>150?' <span class="pill no">นอกพื้นที่</span>':'')+'</div>').join(''):'<div class="mute" style="grid-column:1/-1;padding:4px 0 8px">— ยังไม่มีใครกดเข้างาน</div>')).join('')+'</div>';
  if((d.offToday||[]).length) h+='<div class="mute" style="margin-top:6px">🛌 หยุดประจำวันนี้: '+d.offToday.join(', ')+'</div>';
  const PB=d.perBarber||[]; if(PB.length){ const t=PB.reduce((a,r)=>(a.h+=r.heads,a.s+=r.sales,a.w+=r.wage,a),{h:0,s:0,w:0}); h+='<details><summary>👤 ยอดต่อช่าง '+d.date.slice(5)+' · '+t.h+' หัว · '+n(t.s)+' บ.</summary><div class="scroll"><table><tr><th>ช่าง</th><th>ร้าน</th><th>หัว</th><th>ยอด</th><th>ค่าแรง</th></tr>'+PB.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.shop)+'</td><td>'+r.heads+'</td><td>'+n(r.sales)+'</td><td>'+n(r.wage)+'</td></tr>').join('')+'<tr class="sum"><td>รวม</td><td>'+PB.length+' คน</td><td>'+t.h+'</td><td>'+n(t.s)+'</td><td>'+n(t.w)+'</td></tr></table></div></details>'; }
  else h+='<div class="mute" style="margin-top:6px">ยังไม่ได้กรอกยอดวันนี้'+(own?'':' → <a href="#" onclick="go(\'daily\');return false" style="color:var(--ink)">✏️ กรอกยอด</a>')+'</div>';
  h+='</div>';
  if(d.home) h+='<div class="card" id="homeCard">'+homeHtml(d.home)+'</div>';
  el.innerHTML=h; }

/* ---------- คิว + ลาหยุด ---------- */
let QS={date:TODAY,shop:null,d:null};
const shareUrl=t=>'https://line.me/R/share?text='+encodeURIComponent(t);
const shareBtn=(t,label)=>t?'<a class="btn" style="display:block;text-align:center;text-decoration:none;background:#06c755;color:#fff" href="'+shareUrl(t)+'" target="_blank" rel="noopener">'+(label||'📤 ส่งเข้ากลุ่มไลน์')+'</a><div class="mute" style="margin-top:6px">เลือกกลุ่มรวมร้าน → ส่ง · ระบบจะตอบยืนยันในกลุ่มทันที</div>':'';
const tm=t=>{const m=/(\d+):(\d+)/.exec(t||'');return m?+m[1]*60+ +m[2]:0;}, fm=x=>('0'+Math.floor(x/60)).slice(-2)+':'+('0'+x%60).slice(-2);
const addD=(s,k)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+k);return todayStr(d);};
async function pQueue(el){ QS.shop=QS.shop||INIT.shops[0]; const d=await api({api:'q_day',date:QS.date,shop:QS.shop}); if(!d.ok) throw new Error(d.msg); QS.d=d; renderQueue($('pg_q'),d); renderLeave($('pg_lv'),d); $('pg_q').dataset.loaded=$('pg_lv').dataset.loaded=1; }
function qReload(){ go(PAGE==='lv'?'lv':'q',true); }
function dayChips(){ const chip=(lb,v)=>'<button class="chip'+(QS.date===v?' on':'')+'" onclick="QS.date=\''+v+'\';qReload()">'+lb+'</button>'; const other=QS.date!==TODAY&&QS.date!==addD(TODAY,1); return '<div class="chips">'+chip('วันนี้',TODAY)+chip('พรุ่งนี้',addD(TODAY,1))+'<span class="chip pick'+(other?' on':'')+'">📅 '+(other?esc(QS.d.label):'เลือกวัน')+'<input type="date" value="'+QS.date+'" onchange="if(this.value){QS.date=this.value;qReload()}"></span></div>'; }
function renderQueue(el,d){
  let h='<div class="card">'+dayChips();
  h+='<div class="seg">'+INIT.shops.map(s=>'<button class="'+(s===d.shop?'on':'')+'" onclick="QS.shop=\''+s+'\';qReload()">'+s+'</button>').join('')+'</div>';
  h+='<button class="btn sec w" onclick="qForm({})">+ จองคิว</button>';
  if(d.unsent) h+='<div class="msg warn" style="display:block">📤 มี '+d.unsent+' คิวที่ยังไม่ได้ส่งเข้ากลุ่ม (ป้าย 📤 ในตาราง) — แตะคิวแล้วกดส่ง</div>';
  const wait=(d.leaves||[]).filter(x=>!x.approved); if(wait.length) h+='<div class="msg warn" style="display:block">⏳ คำขอลารออนุมัติ '+wait.length+' รายการ → <a href="#" onclick="go(\'lv\');return false" style="color:inherit">🏖️ ลา / ย้ายร้าน</a></div>';
  h+='</div>';
  // ตาราง
  const o=tm(d.open), c=tm(d.close), R=(c-o)/10, B=d.barbers;
  h+='<div class="card"><h2>📅 '+esc(d.label)+' · '+esc(d.shop)+' <span class="mute">('+d.open+'–'+d.close+' · คิวละ '+d.dur+' นาที)</span></h2>';
  if(!B.filter(b=>!b.any).length&&!(B.find(b=>b.any)||{q:[]}).q.length) h+='<div class="mute">วันนี้ไม่มีช่างประจำร้านนี้</div>';
  else {
    h+='<div class="qg" style="grid-template-columns:40px repeat('+B.length+',1fr);grid-template-rows:28px repeat('+R+',13px)">';
    h+='<div></div>'+B.map((b,i)=>'<div class="qh" style="grid-column:'+(i+2)+'">'+(b.any?'ไม่ระบุ<small>ช่างในร้านสลับกัน</small>':esc(b.name))+(b.any?'':b.off?'<small>🏖️ '+esc(b.off)+'</small>':b.pend?'<small>⏳ รออนุมัติลา</small>':b.moved?'<small>🔁 ย้ายมาช่วย</small>':b.cover?'<small>แทนช่างที่หยุด</small>':b.at!==d.shop?'<small>จาก '+esc(b.home)+'</small>':'')+'</div>').join('');
    for(let r=0;r<R;r+=6) h+='<div class="qt" style="grid-row:'+(r+2)+'/span 6">'+fm(o+r*10)+'</div>';
    B.forEach((b,i)=>{ if(b.off){ h+='<div class="qoff" style="grid-column:'+(i+2)+';grid-row:2/span '+R+'">'+esc(b.off)+'<br>จองไม่ได้</div>'; return; }
      for(let r=0;r<R;r++) h+='<div class="qc'+(r%6===0?' hr':'')+'" style="grid-column:'+(i+2)+';grid-row:'+(r+2)+'" onclick="qForm({barber:\''+b.name+'\',time:\''+fm(Math.floor((o+r*10)/30)*30)+'\'})"></div>';
      b.q.forEach(x=>{ const s=Math.max(0,(tm(x.start)-o)/10), e=Math.min(R,(tm(x.end)-o)/10); h+='<div class="qb '+(x.status==='มาแล้ว'?'done':x.status==='ไม่มา'?'no':'')+(x.ch==='ช่างรับเอง'?' self':'')+'" style="grid-column:'+(i+2)+';grid-row:'+(s+2)+'/'+(e+2)+'" onclick="qShow(\''+x.id+'\')"><b>'+x.start+'</b> '+esc(x.cust)+(x.svc&&x.svc!=='ตัดผม'?' · '+esc(x.svc):'')+(x.sent?'':' 📤')+(x.status==='มาแล้ว'?' ✓':x.status==='ไม่มา'?' ✗':'')+'</div>'; }); });
    h+='</div><div class="mute" style="margin-top:6px">แตะช่องว่าง = จอง · แตะคิว = ดู/มาแล้ว/เลื่อน/ยกเลิก · 📤 = ยังไม่ส่งกลุ่ม · เส้นประ = ช่างรับเอง</div>';
  }
  if((d.elsewhere||[]).length) h+='<div class="mute" style="margin-top:8px">ร้านอื่นวันนี้: '+d.elsewhere.map(x=>esc(x.name)+' ('+(x.off?'🏖️ '+esc(x.off):esc(x.at))+')').join(' · ')+'</div>';
  h+='</div>';
  el.innerHTML=h;
}
/* หน้า 🏖️ ลา / ย้ายร้าน — ปิ๊กอนุมัติ · owner ดู */
function renderLeave(el,d){
  const wait=(d.leaves||[]).filter(x=>!x.approved), ok=(d.leaves||[]).filter(x=>x.approved);
  let h='<div class="card">'+dayChips()+(d.canLeave?'<div class="row"><button class="btn sec" onclick="lvForm()">🏖️ ลงลาให้ช่าง</button><button class="btn sec" onclick="mvForm()">🔁 ย้ายร้าน</button></div><div class="mute" style="margin-top:4px">ลงลาเอง = อนุมัติทันที · ย้ายร้าน = สลับช่างข้ามร้านวันนั้น (ฉุกเฉิน)</div>':'<div class="mute">ลาหยุด/ย้ายร้าน ผู้จัดการเป็นคนลงและอนุมัติ · owner ดูอย่างเดียว</div>')+'</div>';
  h+='<div class="card'+(wait.length?'" style="border-color:#6b5b2a':'')+'"><h2>⏳ คำขอลารออนุมัติ ('+wait.length+')</h2>'+(wait.length?wait.map(x=>'<div class="dl"><div><b>'+esc(x.name)+'</b> · '+esc(x.reason)+' · '+esc(x.label)+(x.days.length>1?' ('+x.days.length+' วัน)':'')+'</div><div class="mute">'+esc((x.note.split('·')[3]||'').replace(/แจ้งล่วงหน้า.*/,'').trim())+'</div>'+(x.notice!=null&&x.notice<7&&x.reason!=='ลาป่วย'?'<div class="pill late">⚠️ แจ้งล่วงหน้า '+x.notice+' วัน (ต้อง 7 วัน)</div>':'')+(x.cover?'<div class="msg err" style="display:block;white-space:pre-line">⚠️ '+esc(x.cover)+'</div>':'')+(d.canLeave?'<div class="row"><button class="btn sec" onclick="lvApprove(\''+x.id+'\',true)">✅ อนุมัติ</button><button class="btn sec" onclick="lvApprove(\''+x.id+'\',false)">❌ ไม่อนุมัติ</button></div>':'<div class="mute">รอผู้จัดการอนุมัติ</div>')+'</div>').join(''):'<div class="mute">ไม่มี</div>')+'</div>';
  h+='<div class="card"><h2>🏖️ ลาที่อนุมัติแล้ว (ที่จะถึง)</h2>'+(ok.length?ok.map(x=>'<div class="dl" style="display:flex;justify-content:space-between;align-items:center"><div><b>'+esc(x.name)+'</b> · '+esc(x.reason)+' · '+esc(x.label)+'</div>'+(d.canLeave?'<button class="btn sec" style="margin:0;padding:5px 10px;font-size:13px" onclick="lvCancel(\''+x.id+'\')">ยกเลิกลา</button>':'')+'</div>').join(''):'<div class="mute">ไม่มี</div>')+'</div>';
  h+='<div class="card"><h2>🔁 ย้ายร้านที่จัดไว้</h2>'+((d.moves||[]).length?d.moves.map(x=>'<div class="dl" style="display:flex;justify-content:space-between;align-items:center"><div><b>'+esc(x.name)+'</b> → '+esc(x.shop)+' · '+esc(x.label)+(x.from?' <span class="mute">(จาก '+esc(x.from)+')</span>':'')+'</div>'+(d.canLeave?'<button class="btn sec" style="margin:0;padding:5px 10px;font-size:13px" onclick="mvCancel(\''+x.id+'\')">ยกเลิก</button>':'')+'</div>').join(''):'<div class="mute">ไม่มี</div>')+'</div>';
  el.innerHTML=h;
}
function qFind(id){ for(const b of QS.d.barbers) for(const x of b.q) if(x.id===id) return x; return null; }
function qShow(id){ const x=qFind(id); if(!x) return;
  let h='<h2>'+x.id+' · '+(x.name==='ไม่ระบุ'?'ไม่ระบุช่าง':esc(x.name))+'</h2><div style="font-size:17px"><b>'+x.start+'–'+x.end+'</b> '+esc(QS.d.label)+' · '+esc(x.shop)+(x.svc&&x.svc!=='ตัดผม'?' · '+esc(x.svc):'')+'</div>'+'<div style="margin-top:6px">👤 '+esc(x.cust)+(x.phone?' · <a href="tel:'+esc(x.phone)+'" style="color:var(--ink)">'+esc(x.phone)+'</a>':'')+'</div><div class="mute">'+esc(x.ch)+' · ลงโดย '+esc(x.by)+' '+esc(x.at)+(x.note?'<br>'+esc(x.note):'')+'</div><div class="pill" style="margin-top:6px">'+esc(x.status)+(x.sent?' · แจ้งกลุ่มแล้ว '+esc(x.sent):' · ยังไม่แจ้งกลุ่ม')+'</div>';
  if(x.status==='จอง'||x.status==='มาแล้ว') h+='<div class="row"><button class="btn sec" onclick="qSt(\''+id+'\',\'มาแล้ว\')">✓ มาแล้ว</button><button class="btn sec" onclick="qSt(\''+id+'\',\'ไม่มา\')">✗ ไม่มา</button></div><div class="row"><button class="btn sec" onclick="closeModal();qForm(qFind(\''+id+'\'))">✏️ เลื่อน/แก้</button><button class="btn sec" onclick="qSt(\''+id+'\',\'ยกเลิก\')">ยกเลิกคิว</button></div>';
  if(!x.sent&&x.status==='จอง') h+=shareBtn(x.share);
  modal(h); }
async function qSt(id,st){ if(st==='ยกเลิก'&&!await confirmA('ยกเลิกคิว '+id+'?')) return; const r=await api({api:'q_status',id,status:st}); if(!r.ok){ alertA(r.msg); return; } if(r.share) modal('<h2>❌ ยกเลิก '+id+' แล้ว</h2><div class="mute">ส่งเข้ากลุ่มให้ช่างรู้ว่าว่างแล้ว</div>'+shareBtn(r.share,'📤 แจ้งกลุ่มว่าว่างแล้ว')); else closeModal(); qReload(); }
/* ฟอร์มจอง/เลื่อน */
let QF={};
function qTimes(open,close,step){ const o=[]; for(let t=tm(open);t<tm(close);t+=step) o.push(fm(t)); return o; } // เวลาเริ่มคิวทุกครึ่งชั่วโมง 10:00–20:00
function qForm(x){ const d=QS.d; QF={id:x.id||'',force:false};

function bankType(){ const t=$('boType').value; const shopT=!!t&&!/ส่วนตัว|owner/.test(t); $('boShopW').style.display=shopT?'flex':'none'; $('boNameW').style.display=/เบิก|พิเศษ/.test(t)?'block':'none'; }
function bankDone(r,id){ if(r.ok&&r.data){ if($('bankBox')) renderBank($('bankBox'),r.data); else { $('pg_pond').dataset.loaded=''; go('set',true); } } msg(id,r.msg||'ไม่สำเร็จ',r.ok?'ok':'err'); $('pg_today').dataset.loaded=''; }
async function bankOut(){ const t=$('boType').value, amt=$('boAmt').value; if(!t){ msg('boMsg','เลือกประเภท','warn'); return; } if(!(Number(amt)>0)){ msg('boMsg','ใส่จำนวนเงิน','warn'); return; }
  if(!(await confirmA('ลงรายการออก '+t+' '+n(amt)+' บาท\nโทรขออนุญาต owner แล้วใช่ไหม?','ยืนยัน'))) return;
  $('boBtn').disabled=true; msg('boMsg','กำลังบันทึก…','warn'); try{ let image=''; const f=$('boImg').files[0]; if(f) image=await shrink(f);
  const r=await api({api:'bank_out',date:$('boDate').value,type:t,shop:$('boShop').value,name:$('boName').value,amount:amt,detail:$('boDetail').value,image}); if(!r.ok){ $('boBtn').disabled=false; msg('boMsg',r.msg,'err'); return; } bankDone(r,'bkMsg'); if(t==='เบิกช่าง'){ const d=await api({api:'pond'}); if(d.ok) renderPond($('pondBox'),d); } }catch(e){ $('boBtn').disabled=false; msg('boMsg','บันทึกไม่ได้','err'); } }
async function bankCancel(id){ if(!(await confirmA('ยกเลิกรายการ #'+id+' (ลงผิด)?'))) return; try{ bankDone(await api({api:'bank_cancel',id}),'bkMsg'); }catch(e){ msg('bkMsg','ไม่สำเร็จ','err'); } }
async function bankCheck(){ const v=String($('bkAct').value).replace(/,/g,''); if(v===''||isNaN(Number(v))){ msg('bkMsg','ใส่ยอดในแอปธนาคาร','warn'); return; } $('bkActBtn').disabled=true; msg('bkMsg','กำลังตรวจ…','warn');
  try{ let image=''; const f=$('bkActImg').files[0]; if(f) image=await shrink(f); bankDone(await api({api:'bank_check',amount:v,image}),'bkMsg'); }catch(e){ $('bkActBtn').disabled=false; msg('bkMsg','บันทึกไม่ได้','err'); } }
async function bankOpen(){ const a=await promptA('ยอดในบัญชีผู้จัดการ ณ เช้าวันที่ '+BK.from+' (สิ้นวันก่อนหน้า)',BK.open==null?'':String(BK.open),true); if(a===null) return; const v=String(a).replace(/,/g,'');
  try{ bankDone(await api({api:'bank_open',amount:v,date:BK.from}),'bkMsg'); }catch(e){ msg('bkMsg','ไม่สำเร็จ','err'); } }
function renderPond(el,d){ if(!d.barbers.length){ el.innerHTML='<div class="card mute">ไม่มีช่างที่จ่ายรายวัน (ตั้งที่ ตั้งค่า คอลัมน์ "จ่ายรายวัน")</div>'; return; }
  const dueDate=new Date(Date.now()-2*86400000); const dueKey=todayStr(dueDate); const own=ME.role==='owner';
  el.innerHTML=d.barbers.map(b=>{ const dueMap={}; b.due.forEach(x=>dueMap[x.d]=1); const todayRow=b.rows.find(r=>r.d===dueKey);
    const adv=b.adv||[]; const left={}; adv.forEach(x=>left[x.m]=x.left); const hasAdv=adv.some(x=>x.left>0);
    // ค่าเริ่มต้นหักเบิก: วันละ advDay ไล่จากวันเก่า → ใหม่ ไม่เกินค่าแรงและไม่เกินเบิกคงเหลือของเดือนนั้น
    const def={}; b.rows.slice(0,20).filter(r=>!r.paid&&r.wage>0).sort((x,y)=>x.d<y.d?-1:1).forEach(r=>{ const m=r.d.slice(0,7); const v=Math.min(b.advDay||200,r.wage,left[m]||0); def[r.d]=v; left[m]=(left[m]||0)-v; });
    let h='<div class="card"><h2>💸 '+b.name+'</h2>';
    h+='<div class="tile" style="text-align:left;margin-bottom:8px"><small>วันนี้ '+TODAY.slice(5)+' ต้องโอนยอดของวันที่ '+dueKey.slice(5)+'</small><b>'+(todayRow?(todayRow.paid?'โอนแล้ว ✓':n(todayRow.wage-(def[todayRow.d]||0))+' บาท'+(def[todayRow.d]?' <small>(ค่าแรง '+n(todayRow.wage)+' − หักเบิก '+n(def[todayRow.d])+')</small>':'')):'ยังไม่ได้กรอกยอดวันนั้น')+'</b>'+(b.due.length>1?'<small style="color:var(--err)">+ ค้างเก่าอีก '+(b.due.length-1)+' วัน รวมค้างทั้งหมด '+n(b.dueTotal)+' บาท</small>':'')+'</div>';
    adv.filter(x=>x.total>0).forEach(x=>{ h+='<div class="tile" style="text-align:left;margin-bottom:8px;border-color:#6b5b2a"><small>📝 เบิกล่วงหน้า '+x.m+'</small><b>คงเหลือ '+n(x.left)+' บาท</b><small>เบิก '+n(x.total)+' · หักรายวันแล้ว '+n(x.ded)+(x.left>0?' · ที่เหลือสิ้นเดือนหักจากเงินเดือน/โบนัส':' · ครบแล้ว ✓')+'</small></div>'; });
    if(!own) h+='<button class="btn sec" style="margin:0 0 8px" onclick="advForm(\''+esc(b.name)+'\',\''+esc(b.shop||'')+'\')">+ เบิกล่วงหน้า</button>';
    h+='<div class="mute" style="margin-bottom:6px">ติ๊ก ✓ วันที่โอนจริง (ติ๊กได้หลายวัน)'+(hasAdv?' · ช่อง "หักเบิก" แก้ได้ (ไม่หักใส่ 0)':'')+' → แนบสลิป → กดบันทึก · กดผิดกด "ยกเลิก" ท้ายรายการได้</div>';
    h+='<div class="scroll"><table><tr><th>โอน?</th><th>วันที่ตัด</th><th>ค่าแรง</th>'+(hasAdv||b.rows.some(r=>r.ded)?'<th>หักเบิก</th><th>โอนจริง</th>':'')+'<th>สถานะ</th></tr>'+b.rows.slice(0,20).map(r=>{ const isDue=!!dueMap[r.d]; const canPay=!r.paid&&r.wage>0; const st=r.paid?'<span style="color:var(--ok)">โอนแล้ว '+r.paidOn.slice(5)+'</span> <a href="#" onclick="pondUnpay(\''+esc(b.name)+'\',\''+r.d+'\');return false" class="mute" style="font-size:11px">ยกเลิก</a>':isDue?'<b>ครบกำหนด</b>':r.wage>0?'<span class="mute">รอถึงกำหนด</span>':'<span class="mute">-</span>';
      const dv=def[r.d]||0; const dedCell=(hasAdv||b.rows.some(x=>x.ded))?('<td>'+(canPay&&hasAdv?'<input class="dd" data-d="'+r.d+'" inputmode="numeric" value="'+dv+'" oninput="pondSum(this)" style="width:64px;padding:6px;margin:0;text-align:right">':r.ded?n(r.ded):'-')+'</td><td class="net"><b>'+n(r.wage-(r.paid?r.ded:dv))+'</b></td>'):'';
      return '<tr><td>'+(canPay?'<input type="checkbox" class="pd" value="'+r.d+'" data-w="'+r.wage+'" onchange="pondSum(this)" style="width:22px;height:22px">':r.paid?'<input type="checkbox" checked disabled style="width:22px;height:22px;opacity:.4">':'')+'</td><td>'+r.d.slice(5)+'<br><small class="mute">'+r.shop+' '+r.heads+' หัว</small></td><td>'+n(r.wage)+'</td>'+dedCell+'<td>'+st+'</td></tr>'; }).join('')+'</table></div>';
    h+='<label>รูปสลิปโอน (ถ้ามี)</label><input type="file" id="pdImg_'+b.name+'" accept="image/*"><button class="btn ok w" onclick="pondPay(this,\''+esc(b.name)+'\')"><span class="sum">บันทึกว่าโอนแล้ว</span> + แจ้ง'+b.name+'</button><div id="pdMsg_'+b.name+'" class="msg"></div></div>'; return h; }).join(''); }
function pondDed(tr){ const i=tr.querySelector('.dd'); const w=Number(tr.querySelector('.pd')?.dataset.w)||0; if(!i) return 0; return Math.max(0,Math.min(w,Math.round(Number(String(i.value).replace(/,/g,''))||0))); }
function pondSum(elm){ const card=elm.closest('.card'); const tr=elm.closest('tr'); if(tr&&tr.querySelector('.dd')&&tr.querySelector('.net')){ const w=Number(tr.querySelector('.pd').dataset.w)||0; tr.querySelector('.net').innerHTML='<b>'+n(w-pondDed(tr))+'</b>'; }
  let t=0,dd=0; [...card.querySelectorAll('.pd:checked')].forEach(c=>{ const r=c.closest('tr'); const x=pondDed(r); t+=(Number(c.dataset.w)||0)-x; dd+=x; }); card.querySelector('.sum').textContent=(t||dd)?'บันทึกว่าโอนแล้ว '+n(t)+' บ.'+(dd?' (หักเบิก '+n(dd)+')':''):'บันทึกว่าโอนแล้ว'; }
/* + เบิกล่วงหน้า = ลงรายการออกจากบัญชีผู้จัดการ ประเภท "เบิกช่าง" (เติมฟอร์มให้) */
function advForm(name,shop){ const t=$('boType'); if(!t){ alertA('ลงเบิกได้ที่การ์ด "ลงรายการออกจากบัญชีผู้จัดการ" ประเภท เบิกช่าง'); return; } t.value='เบิกช่าง'; bankType(); if(shop&&$('boShop')) $('boShop').value=shop; $('boName').value=name; $('boDetail').value=name+' เบิกล่วงหน้า (หักรายวัน)'; t.closest('.card').scrollIntoView({behavior:'smooth'}); $('boAmt').focus(); }
async function pondUnpay(name,d){ if(!(await confirmA('ยกเลิกรายการโอน '+name+' วันที่ '+d+'?'))) return; const r=await api({api:'pond_unpay',name,date:d}); if(r.ok&&r.data) renderPond($('pondBox'),r.data); else msg('pdMsg_'+name,r.msg||'ไม่สำเร็จ','err'); $('pg_today').dataset.loaded=''; }
async function pondPay(btn,name){ const card=btn.closest('.card'); const dates=[...card.querySelectorAll('.pd:checked')].map(c=>c.value); if(!dates.length){ msg('pdMsg_'+name,'ติ๊กวันที่โอนก่อน','warn'); return; } btn.disabled=true; msg('pdMsg_'+name,'กำลังบันทึก…','warn');
  try{ let image=''; const f=$('pdImg_'+name).files[0]; if(f) image=await shrink(f); const deds={}; [...card.querySelectorAll('.pd:checked')].forEach(c=>{ const x=pondDed(c.closest('tr')); if(x) deds[c.value]=x; }); const r=await api({api:'pond_paid',name,dates,deds,image}); if(!r.ok){msg('pdMsg_'+name,r.msg,'err');btn.disabled=false;return;} renderPond($('pondBox'),r.data); $('pg_today').dataset.loaded=''; }catch(e){ msg('pdMsg_'+name,'บันทึกไม่ได้','err'); btn.disabled=false; } }

/* ---------- รายเดือน ---------- */
let M_YM=TODAY.slice(0,7);
async function pMonth(el){ const d=await api({api:'month',ym:M_YM}); if(!d.ok) throw new Error(d.msg);
  let h='<div class="card"><div class="row"><h2>📊 รายเดือน</h2>'+monthSel('mYm',M_YM,'M_YM=this.value;go(\'month\',true)')+'</div>';
  h+='<div class="tiles"><div class="tile"><small>ยอดขาย</small><b>'+n(d.total.sales)+'</b></div><div class="tile"><small>ค่าแรง+รายจ่าย</small><b>'+n(d.total.wage+d.total.exp)+'</b></div><div class="tile"><small>กำไร</small><b style="color:'+(d.total.profit>=0?'var(--ok)':'var(--err)')+'">'+n(d.total.profit)+'</b></div></div></div>';
  h+='<div class="card"><h2>ต่อร้าน</h2><div class="scroll"><table><tr><th>ร้าน</th><th>หัว/เป้า</th><th>ยอดขาย</th><th>ค่าแรง</th><th>รายจ่าย</th><th>กำไร</th></tr>'+d.byShop.map(s=>'<tr><td>'+s.shop+'</td><td>'+s.heads+' / '+(s.target?'<b>'+s.target+'</b>'+(s.heads>=s.target?' ✓':''):'<span class="mute">ยังไม่ตั้ง</span>')+'</td><td>'+n(s.sales)+'</td><td>'+n(s.wage)+'</td><td>'+n(s.expTotal)+'</td><td><b>'+n(s.profit)+'</b></td></tr>').join('')+'</table></div>';
  h+='<div class="mute" style="margin-top:6px">รายจ่าย: '+d.byShop.map(s=>s.shop+' → '+Object.keys(s.expenses).map(k=>k+' '+n(s.expenses[k])).join(', ')).join(' | ')+'</div></div>';
  (d.customers||[]).forEach(c=>{ const mx=Math.max(1,...c.sources.map(s=>s.n)), pn=c.newC+c.regC?Math.round(c.newC*100/(c.newC+c.regC)):0;
    h+='<div class="card"><h2>👥 ลูกค้า '+esc(c.shop)+' · '+M_YM+'</h2><div class="tiles"><div class="tile"><small>ลูกค้าทั้งหมด</small><b>'+c.total+'</b></div><div class="tile"><small>ลูกค้าใหม่</small><b>'+c.newC+'</b></div><div class="tile"><small>ลูกค้าประจำ</small><b>'+c.regC+'</b></div></div>'
     +'<div class="mute" style="margin:6px 0 10px">ลูกค้าใหม่ '+pn+'% · ข้อมูลจาก '+c.days+' วันที่ช่างส่งสรุป'+(c.noDetail?' · ไม่ได้แยกรายคน '+c.noDetail+' คน':'')+'</div>'
     +(c.sources.length?'<div style="font-weight:600;margin-bottom:6px">ลูกค้าใหม่มาจากไหน</div>'+c.sources.map(s=>'<div class="srow"><span>'+esc(s.src)+'</span><span class="sbar"><i style="width:'+Math.round(s.n*100/mx)+'%"></i></span><b>'+s.n+'</b></div>').join(''):'<div class="mute">ยังไม่มีข้อมูลที่มา</div>')+'</div>'; });
  MD=d.perDay||[];
  h+='<div class="card"><h2>👤 ช่าง <span class="mute">แตะชื่อ = ดูรายวันของคนนั้น</span></h2><div class="scroll"><table><tr><th>ช่าง</th><th>วัน</th><th>หัว</th><th>ยอด</th><th>ค่าแรง</th><th>สาย</th><th></th></tr>'+d.barbers.sort((a,b)=>b.wage-a.wage).map(b=>'<tr onclick="mdShow(\''+esc(b.name)+'\')" style="cursor:pointer"><td><b>'+esc(b.name)+'</b></td><td>'+b.days+'</td><td>'+b.heads+'</td><td>'+n(b.sales)+'</td><td>'+n(b.wage)+'</td><td>'+(b.late?b.late+' ('+b.lateMin+'น.)':'-')+'</td><td class="mute">›</td></tr>').join('')+'</table></div></div>';
  h+='<div class="card"><h2>รายวัน (หัว / ยอด)</h2><div class="scroll"><table><tr><th>วันที่</th>'+INIT.shops.map(s=>'<th>'+s+'</th>').join('')+'<th>รวม</th></tr>'+d.days.map(r=>{let t=0,tsales=0;const cells=INIT.shops.map(s=>{const x=r[s]||{heads:0,sales:0};t+=x.heads;tsales+=x.sales;return '<td>'+(x.heads?x.heads+' / '+n(x.sales):'-')+'</td>';}).join('');return '<tr><td>'+r.d.slice(5)+'</td>'+cells+'<td><b>'+t+'</b> / '+n(tsales)+'</td></tr>';}).join('')+'</table></div></div>';

/* รายวันต่อช่าง — แตะชื่อช่างในตาราง → เปิดกล่อง */
let MD=[];
function mdShow(name){ const rows=MD.filter(r=>r.name===name); if(!rows.length){ alertA('ยังไม่มีข้อมูล '+name+' เดือนนี้'); return; }
  const t=rows.reduce((a,r)=>(a.h+=r.heads,a.s+=r.sales,a.w+=r.wage,a),{h:0,s:0,w:0}); const daily=rows.some(r=>r.daily); const paid=rows.filter(r=>r.paidOn).length;
  let h='<h2>👤 '+esc(name)+' · '+M_YM+'</h2><div class="tiles"><div class="tile"><small>วันทำงาน</small><b>'+rows.length+'</b></div><div class="tile"><small>หัว</small><b>'+t.h+'</b><small>เฉลี่ย '+(t.h/rows.length).toFixed(1)+'/วัน</small></div><div class="tile"><small>ค่าแรง</small><b>'+n(t.w)+'</b><small>ยอด '+n(t.s)+'</small></div></div>';
  if(daily) h+='<div class="mute" style="margin-top:6px">โอนรายวันแล้ว '+paid+' / '+rows.length+' วัน'+(paid<rows.length?' · <b style="color:var(--err)">ค้าง '+(rows.length-paid)+' วัน</b>':' ✓')+'</div>';
  h+='<div class="scroll" style="margin-top:8px"><table><tr><th>วันที่</th><th>ร้าน</th><th>หัว</th><th>ยอด</th><th>ค่าแรง</th>'+(daily?'<th>โอน</th>':'')+'</tr>'
   +rows.map(r=>'<tr><td>'+r.d.slice(5)+'</td><td>'+esc(r.shop)+'</td><td>'+r.heads+'</td><td>'+n(r.sales)+'</td><td>'+n(r.wage)+'</td>'+(daily?'<td>'+(r.paidOn?'<span style="color:#b7e4c0">✓ '+r.paidOn.slice(5)+'</span>':'<span class="mute">ยัง</span>')+'</td>':'')+'</tr>').join('')+'</table></div>';
  modal(h); }
async function setTarget(shop,cur){ M_YM=PAGE==='set'?SET_YM:M_YM;
  if(cur&&!(await confirmA('เป้า '+shop+' เดือน '+M_YM+' ตั้งไว้แล้ว '+cur+' หัว\nต้องการเปลี่ยนใช่ไหม?','เป้าตั้งไว้แล้ว'))) return;
  const v=await promptA((cur?'แก้เป้าหัว ':'ตั้งเป้าหัว ')+shop+' เดือน '+M_YM,cur||'',true); if(v==null||v==='') return;
  if(!/^\d+$/.test(String(v).trim())){ await alertA('ใส่ตัวเลขจำนวนหัว'); return; }
  const r=await api({api:'target_set',ym:M_YM,shop,val:v.trim()}); msg('gmsg',r.msg,r.ok?'ok':'err'); if(r.ok){ ['pg_today','pg_pay','pg_month'].forEach(k=>$(k).dataset.loaded=''); SET_YM=M_YM; go('set',true); } }

/* ---------- ⚙️ ตั้งค่า (owner) — เป้าหัว · ช่าง · ยอดยกมาบัญชี ---------- */
let SET_YM=TODAY.slice(0,7);
async function pSet(el){ const own=ME.role==='owner'; const [m,b]=await Promise.all([api({api:'month',ym:SET_YM}),api({api:'bank'})]); if(!m.ok) throw new Error(m.msg);

  h+='<table><tr><th>ร้าน</th><th>หัวตอนนี้</th><th>เป้า</th><th></th></tr>'+m.byShop.map(s=>'<tr><td>'+esc(s.shop)+'</td><td>'+s.heads+'</td><td>'+(s.target?'<b>'+s.target+'</b>'+(s.heads>=s.target?' ✓':''):'<span class="mute">ยังไม่ตั้ง</span>')+'</td><td>'+(own?'<button class="btn sec" style="margin:0;padding:5px 10px;font-size:13px" onclick="setTarget(\''+esc(s.shop)+'\','+(s.target||0)+')">'+(s.target?'แก้':'ตั้ง')+'</button>':'')+'</td></tr>').join('')+'</table></div>';
  h+='<div class="card"><h2>👤 ช่าง</h2><div class="scroll"><table><tr><th>ชื่อ</th><th>ร้านหลัก</th><th>ขั้นต่ำ/วัน</th><th>ปกส.</th><th>จ่าย</th></tr>'+(INIT.barbers||[]).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.shop)+'</td><td>'+n(x.min)+'</td><td>'+(x.sso?n(x.sso):'-')+'</td><td>'+(x.daily?'รายวัน':'วันที่ 2')+'</td></tr>').join('')+'</table></div>'+(own?'<button class="btn sec w" onclick="barberForm()">เพิ่ม / แก้ / ช่างออก</button>':'<div class="mute">owner แก้ได้</div>')+'</div>';
  if(b.ok){ BK=b; h+='<div class="card"><h2>💼 วงเงินสำรองผู้จัดการ</h2><div>'+(b.float==null?'<span class="mute">ยังไม่ใช้ — ตอนนี้เงินโอนลูกค้า'+esc(b.shop)+'เข้าบัญชีผู้จัดการ</span>':n(b.float)+' บาท เริ่มเช้า '+b.from+' <span class="mute">· เงินโอนลูกค้า 3 ร้านเข้าบัญชี owner</span>')+'</div>'+(own?'<button class="btn sec" onclick="floatSet()">'+(b.float==null?'เริ่มใช้วงเงินสำรอง':'แก้วงเงิน / วันเริ่ม')+'</button>':'')+(b.float!=null?'<div id="bkMsg" class="msg"></div>':'')+'</div>'; }
  if(b.ok&&b.float==null){ h+='<div class="card"><h2>🏦 บัญชีผู้จัดการ — ยอดยกมา</h2><div>'+(b.open==null?'<span class="mute">ยังไม่ได้ตั้ง</span>':n(b.open)+' บาท ณ เช้า '+b.from)+'</div>'+(own?'<button class="btn sec" onclick="bankOpen()">'+(b.open==null?'ตั้งยอดยกมา':'แก้ยอดยกมา')+'</button>':'')+'<div id="bkMsg" class="msg"></div></div>'; }
  h+='<div class="card"><h2>📖 คู่มือ</h2><div class="mute">พิมพ์ "คู่มือ" ในไลน์ OA ได้ทุกคน · กฎที่ระบบใช้แก้ได้ในแผ่น ตั้งค่า ของ Google Sheet</div><a class="btn sec" style="text-decoration:none;display:inline-block" href="https://docs.google.com/spreadsheets/d/'+(BBO.SHEET_ID||'')+'/edit" target="_blank">เปิด Google Sheet</a></div>';
  el.innerHTML=h; }

/* ---------- เงินเดือน ---------- */
let P_YM=(()=>{const d=new Date();d.setDate(0);const m=todayStr(d).slice(0,7);return m<(BBO.START_YM||'2026-11')?(BBO.START_YM||'2026-11'):m;})();
async function pPay(el){ const d=await api({api:'payroll',ym:P_YM}); if(!d.ok) throw new Error(d.msg);
  let h='<div class="card"><div class="row"><h2>💰 เงินเดือน</h2>'+monthSel('pYm',P_YM,'P_YM=this.value;go(\'pay\',true)')+'</div><div class="mute">สถานะ: '+(d.paid?'โอนแล้ว ✓ ส่งสลิปแล้ว':d.closed?'ปิดงวดแล้ว รอโอน':'ยังไม่ปิดงวด')+' · รวมจ่ายวันที่ 2 <b>'+n(d.total)+'</b> บาท</div>';
  h+='<div class="scroll"><table><tr><th>ช่าง</th><th>วัน</th><th>หัว</th><th>ค่าแรง</th><th>โบนัส</th><th>เบิก</th><th>ปกส.</th><th>จ่ายรายวัน</th><th>สุทธิ</th></tr>'+d.people.map(p=>'<tr><td>'+p.name+' <small class="mute">'+p.shop+'</small></td><td>'+p.days+'</td><td>'+p.heads+'</td><td>'+n(p.wage)+'</td><td>'+n(p.bonus)+'</td><td>'+n(p.advance)+'</td><td>'+n(p.sso)+'</td><td>'+n(p.dailyPaid)+'</td><td><b>'+n(p.net)+'</b></td></tr>').join('')+'</table></div>';
  h+='<table style="margin-top:8px"><tr><th>ร้าน</th><th>หัว</th><th>เป้า</th><th>ผล</th></tr>'+d.shops.map(s=>'<tr><td>'+s.shop+'</td><td>'+s.heads+'</td><td>'+s.target+'</td><td>'+s.hit+'</td></tr>').join('')+'</table>';
  if(ME.role==='owner'){ h+='<div class="row">'+(d.closed?'':'<button class="btn warn" onclick="closeMonth()">🔒 ปิดงวด '+P_YM+'</button>')+(d.paid?'':'<button class="btn ok" onclick="paidForm()">✅ โอนแล้ว + ส่งสลิป</button>')+'</div>'; }
  h+='<div id="pMsg" class="msg"></div></div>'; el.innerHTML=h; window.PAY=d; }
async function closeMonth(){ if(!(await confirmA('ปิดงวด '+P_YM+'?\nตรวจว่าผู้จัดการกรอกยอดครบแล้ว','ปิดงวด'))) return; msg('pMsg','กำลังปิดงวด…','warn'); const r=await api({api:'close_month',ym:P_YM}); msg('pMsg',r.msg,r.ok?'ok':'err'); if(r.ok) go('pay',true); }
function paidForm(){ modal('<h2>✅ โอนแล้ว '+P_YM+'</h2><div class="mute">แนบรูปสลิปโอนต่อคน (ไม่บังคับ) → ระบบส่งสลิป PDF + รูปเข้าไลน์ช่าง และเก็บใน Drive</div>'+PAY.people.map(p=>'<label>'+p.name+' — สุทธิ '+n(p.net)+' บาท</label><input type="file" accept="image/*" data-name="'+esc(p.name)+'" class="slipImg">').join('')+'<button class="btn ok w" id="paidBtn" onclick="sendPaid()">ยืนยันโอนแล้ว + ส่งสลิป</button><div id="paidMsg" class="msg"></div>'); }
async function sendPaid(){ $('paidBtn').disabled=true; msg('paidMsg','กำลังสร้างสลิป PDF และส่งไลน์… (ประมาณ 1 นาที)','warn'); const slips={}; for(const inp of document.querySelectorAll('.slipImg')){ if(inp.files[0]) slips[inp.dataset.name]=await shrink(inp.files[0]); }
  try{ const r=await api({api:'paid',ym:P_YM,slips}); msg('paidMsg',r.msg,r.ok?'ok':'err'); if(r.ok) setTimeout(()=>{closeModal();go('pay',true);},2500); }catch(e){ msg('paidMsg','ส่งไม่สำเร็จ: '+e.message,'err'); } $('paidBtn').disabled=false; }
function barberForm(){ modal('<h2>👤 จัดการช่าง</h2><div class="mute">เพิ่มใหม่ หรือพิมพ์ชื่อเดิมเพื่อแก้ไข · ช่างออก: ใส่วันออก</div><label>ชื่อ</label><input id="bName" list="bList"><datalist id="bList">'+INIT.barbers.map(b=>'<option value="'+esc(b.name)+'">').join('')+'</datalist><div class="row"><div><label>ร้านหลัก</label>'+shopSel('bShop')+'</div><div><label>ขั้นต่ำ/วัน</label><input id="bMin" inputmode="numeric" value="500"></div></div><div class="row"><div><label>ประกันสังคม/เดือน</label><input id="bSso" inputmode="numeric" value="0"></div><div><label>PIN (4–6 หลัก)</label><input id="bPin" inputmode="numeric"></div></div><label><input type="checkbox" id="bDaily" style="width:auto"> จ่ายรายวัน (แบบปอน)</label><div class="row"><div><label>วันเข้า</label><input type="date" id="bStart" value="'+TODAY+'"></div><div><label>วันออก (ถ้าออก)</label><input type="date" id="bEnd"></div></div><label><input type="checkbox" id="bUnbind" style="width:auto"> ปลด LINE เดิม (เปลี่ยนเครื่อง/บัญชี)</label><button class="btn ok w" onclick="saveBarber()">บันทึก</button><div id="bMsg" class="msg"></div>'); }
async function saveBarber(){ const p={api:'barber_save',name:$('bName').value,shop:$('bShop').value,min:$('bMin').value,sso:$('bSso').value,pin:$('bPin').value,daily:$('bDaily').checked,start:$('bStart').value,end:$('bEnd').value,unbind:$('bUnbind').checked}; if(p.end&&!(await confirmA('ยืนยันว่า '+p.name+' ออกวันที่ '+p.end+'?'))) return; const r=await api(p); msg('bMsg',r.msg,r.ok?'ok':'err'); if(r.ok){ INIT=await api({api:'init'}); } }
boot();
</script></body></html>
