<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber Dashboard</title>
<link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Barber"><meta name="theme-color" content="#1f3864"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0f0f11;--card:#1c1c20;--ink:#f3f3f5;--mute:#9a9aa3;--line:#2e2e34;--pri:#f3f3f5;--pri-ink:#0f0f11;--ok:#d4d4d8;--warn:#a3a3ab;--err:#e5484d;--y:#26262b;--soft:#141417}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Sarabun,Roboto,sans-serif;padding-bottom:72px}
.top{background:#000;color:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.top b{font-size:17px}.top small{opacity:.8}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}h2{font-size:15px;margin:0 0 8px;color:var(--ink);letter-spacing:.3px}.mute{color:var(--mute);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.tile b{display:block;font-size:18px}.tile small{color:var(--mute);font-size:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:var(--mute)}.nav button.on{color:var(--pri);font-weight:700}.nav button span{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}td:first-child,th:first-child{text-align:left}th{color:var(--mute);font-weight:600;font-size:12px}tr.sum td{font-weight:700;background:var(--soft)}
input,select,textarea{width:100%;border:1px solid #3a3a41;border-radius:9px;padding:9px;font-size:15px;background:var(--soft);color:var(--ink)}label{font-size:12px;color:var(--mute);display:block;margin-top:8px}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;color:var(--pri-ink);background:var(--pri);cursor:pointer;margin-top:8px}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.err{background:var(--err);color:#fff}.btn.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn.w{width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}.msg{border-radius:9px;padding:9px 12px;margin-top:8px;font-size:13.5px;display:none}.msg.ok{background:#2a2a30;color:#e5e5ea;border:1px solid #4a4a52}.msg.err{background:#3a1d1f;color:#ffb3b6}.msg.warn{background:#2a2a30;color:#d4d4d8}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:8px 4px;font-size:14px;font-weight:600}.seg button.on{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.hide{display:none}.pill{display:inline-block;background:#2a2a30;color:var(--ink);border:1px solid #4a4a52;border-radius:20px;padding:2px 8px;font-size:12px;margin:2px}.pill.late{background:#3a3a41;color:#d4d4d8}.pill.no{background:#3a1d1f;color:#ffb3b6}
.grid td input{width:60px;padding:6px;text-align:right;font-size:14px}.grid td input.tot{border:0;background:transparent;font-weight:700;width:64px;padding:6px 2px}.grid td input.wide{width:80px}.grid td.n{text-align:left;font-weight:600}
.att{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.1fr;column-gap:8px;align-items:stretch;font-size:13.5px}.att>div{padding:7px 0;border-bottom:1px solid var(--line);text-align:left;display:flex;align-items:center;line-height:1.3}.att>div>div{display:block;white-space:nowrap}.att>div>div b{font-size:15px}.att .hd{color:var(--mute);font-size:12px;font-weight:600}.att .shop{grid-column:1/-1;font-weight:700;padding:8px 0 2px;border:0;color:var(--mute);font-size:12.5px;letter-spacing:.3px}.att .nm{font-weight:600}
.dl{border-bottom:1px solid var(--line);padding:10px 0}.dlh{margin-bottom:6px;display:flex;align-items:center;gap:6px}.srow{display:grid;grid-template-columns:minmax(80px,40%) 1fr 28px;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}.sbar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.sbar i{display:block;height:100%;background:#e8e8ea;border-radius:4px}.srow b{text-align:right}.ncard{margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px}.nrow{display:flex;justify-content:space-between;margin-bottom:6px}.nck{margin-top:4px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04)}.nck.ok{background:rgba(60,170,90,.15)}.nck.bad{background:rgba(220,60,60,.18)}.npre{white-space:pre-wrap;font-family:inherit;font-size:13px;margin:6px 0 0;opacity:.85}details summary{margin-top:6px;cursor:pointer;font-size:12.5px}.bkbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-size:14px;font-weight:600}.bkbar .mute{font-weight:400;font-size:12.5px}.bkbar.none{opacity:.5;border-style:dashed;font-weight:400}.bkimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-top:6px}.dlg{display:grid;grid-template-columns:.7fr 1fr 1fr 1fr;gap:6px}.dlg label,.dlf label{margin:0;font-size:11.5px}.dlg input{padding:8px 6px;text-align:right;margin-top:2px}.dlg input.tot{border:0;background:transparent;font-weight:700;font-size:16px;padding:8px 2px}.dlf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}.dlf label{display:flex;align-items:center;gap:6px}.dlf input{width:90px;padding:6px;text-align:right}
.slp{margin-top:6px;font-size:12.5px;padding:6px 8px;border-radius:8px;cursor:pointer}.slp:empty{display:none}.slp.ok{background:#1f2a22;color:#b7e4c0}.slp.bad{background:#3a1d1f;color:#ffb3b6}.slp.warn{background:#2a2a30;color:#e5e5ea}
.login{text-align:center;padding:40px 16px}.login .btn{background:#06c755;color:#fff}
.scroll{overflow-x:auto}.bar{height:8px;background:#2e2e34;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:9}.modal .card{width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;margin:0}.x{float:right;background:none;border:0;font-size:22px;color:var(--mute)}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="config.js"></script></head>
<body>
<div class="top"><div><b>✂️ Barber Dashboard</b><br><small id="me"></small></div><button class="btn sec" style="margin:0;padding:6px 10px;font-size:13px;border-color:#fff;color:#fff;background:none" onclick="reload()">⟳</button></div>
<div class="wrap">
  <div id="loginBox" class="login card hide"><div style="font-size:40px">✂️</div><h2>Barber Back Office</h2><div class="mute">ล็อกอินด้วย LINE ครั้งเดียว เครื่องนี้จะจำไว้ 90 วัน</div><button class="btn w" onclick="lineLogin()">ล็อกอินด้วย LINE</button><div id="loginMsg" class="msg"></div></div>
  <div id="loading" class="card mute">กำลังโหลด…</div>
  <div id="pg_today" class="pg hide"></div>
  <div id="pg_daily" class="pg hide"></div>
  <div id="pg_exp" class="pg hide"></div>
  <div id="pg_pond" class="pg hide"></div>
  <div id="pg_month" class="pg hide"></div>
  <div id="pg_pay" class="pg hide"></div>
  <div id="gmsg" class="msg"></div>
</div>
<div class="nav" id="nav">
  <button data-p="today" onclick="go('today')"><span>📍</span>วันนี้</button>
  <button data-p="daily" onclick="go('daily')"><span>✏️</span>กรอกยอด</button>
  <button data-p="exp" onclick="go('exp')"><span>🧾</span>รายจ่าย</button>
  <button data-p="pond" onclick="go('pond')"><span>💸</span>โอนรายวัน</button>
  <button data-p="month" onclick="go('month')"><span>📊</span>รายเดือน</button>
  <button data-p="pay" onclick="go('pay')"><span>💰</span>เงินเดือน</button>
</div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="modal" id="dlg" style="align-items:center"><div class="card" style="width:92%;max-width:360px;border-radius:16px;margin:0"><h2 id="dlgT"></h2><div id="dlgM" style="white-space:pre-line;margin-bottom:8px"></div><input id="dlgI" style="display:none" onkeydown="if(event.key==='Enter')dlgEnd(true)"><div class="row" style="margin-top:12px"><button class="btn sec" id="dlgNo" onclick="dlgEnd(false)">ยกเลิก</button><button class="btn" id="dlgOk" onclick="dlgEnd(true)">ตกลง</button></div></div></div>
<script>
const $=id=>document.getElementById(id); const GAS=BBO.GAS_URL; let ADT=localStorage.getItem('bbo_adt')||'', ME=null, INIT=null, PAGE='today', TODAY=todayStr();
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function n(v){ return (Number(v)||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function msg(id,t,c){ const m=$(id); m.textContent=t; m.className='msg '+c; m.style.display=t?'block':'none'; }
async function api(p){ p.adt=ADT; const r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)}); const j=await r.json(); if(j.expired){ localStorage.removeItem('bbo_adt'); ADT=''; showLogin('หมดอายุ กรุณาล็อกอินใหม่'); throw new Error('expired'); } return j; }
function showLogin(m){ $('loading').classList.add('hide'); $('loginBox').classList.remove('hide'); document.querySelectorAll('.pg').forEach(e=>e.classList.add('hide')); if(m) msg('loginMsg',m,'warn'); }
async function lineLogin(){ try{ await liff.init({liffId:BBO.LIFF_ID}); if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href.split('#')[0]}); return; } const idt=liff.getIDToken(); const r=await api({api:'adt',idt,lb:navigator.userAgent.slice(0,40)}); if(!r.ok){ msg('loginMsg',r.msg,'err'); try{liff.logout();}catch(e){} return; } ADT=r.adt; localStorage.setItem('bbo_adt',ADT); boot(); }catch(e){ msg('loginMsg','ล็อกอินไม่สำเร็จ: '+e.message,'err'); } }
async function boot(){
  if(/PASTE/.test(GAS)){ showLogin('ยังไม่ได้ตั้ง GAS_URL ใน config.js'); return; }
  if(/ Line\//i.test(navigator.userAgent)){ $('loading').classList.add('hide'); $('loginBox').classList.remove('hide'); $('loginBox').innerHTML='<div style="font-size:40px">✂️</div><h2>เปิดในเบราว์เซอร์ปกติ</h2><div class="mute">หน้านี้ใช้ในเบราว์เซอร์ของ LINE ไม่ได้ — กด ⋯ หรือ ↗ มุมขวาบน แล้วเลือก "เปิดในเบราว์เซอร์" (Safari/Chrome) หรือพิมพ์ลิงก์นี้ในเบราว์เซอร์</div><input readonly value="'+location.origin+location.pathname+'" onclick="this.select()" style="margin-top:10px;text-align:center">'; return; }
  $('loginBox').classList.add('hide'); $('loading').classList.remove('hide');
  if(!ADT){ try{ await liff.init({liffId:BBO.LIFF_ID}); if(liff.isLoggedIn()) return lineLogin(); }catch(e){} showLogin(''); return; }
  // แสดงข้อมูลล่าสุดที่จำไว้ก่อน (ทันที) แล้วค่อยโหลดใหม่เบื้องหลัง
  let cached=null; try{ cached=JSON.parse(localStorage.getItem('bbo_init')||'null'); }catch(e){}
  const first=location.hash.slice(1)||'today';
  if(cached&&cached.ok){ INIT=cached; ME=INIT.me; $('me').textContent=(ME.role==='owner'?'Owner':'Manager')+' · กำลังอัปเดต…'; $('loading').classList.add('hide'); if(first==='today'&&INIT.today&&INIT.today.date===TODAY){ const el=$('pg_today'); renderToday(el,INIT.today); el.dataset.loaded=1; } go(first); }
  let r; try{ r=await api({api:'init',withToday:true,date:TODAY}); }catch(e){ if(!cached) showLogin('เชื่อมต่อไม่ได้ ลองใหม่'); return; }
  if(!r.ok){ showLogin(r.msg||''); return; }
  INIT=r; ME=INIT.me; try{ localStorage.setItem('bbo_init',JSON.stringify(INIT)); }catch(e){}
  $('me').textContent=ME.role==='owner'?'Owner':'Manager'; $('loading').classList.add('hide');
  if(INIT.today){ const el=$('pg_today'); renderToday(el,INIT.today); el.dataset.loaded=1; }
  if(!cached) go(first);
  setTimeout(prefetch,800);
}
function reload(){ go(PAGE,true); }
const LOADERS={today:pToday,daily:pDaily,exp:pExp,pond:pPond,month:pMonth,pay:pPay};
async function prefetch(){ await Promise.all(['today','daily','exp','pond','month','pay'].map(async p=>{ const el=$('pg_'+p); if(el.dataset.loaded||el.dataset.busy) return; el.dataset.busy=1; if(!el.innerHTML) el.innerHTML='<div class="card mute">กำลังโหลด…</div>'; try{ await LOADERS[p](el); el.dataset.loaded=1; }catch(e){} delete el.dataset.busy; })); }
function go(p,force){ if(!INIT) return; PAGE=p; location.hash=p; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); document.querySelectorAll('.pg').forEach(e=>e.classList.add('hide')); const el=$('pg_'+p); el.classList.remove('hide'); if(el.dataset.busy&&!force){ const t0=Date.now(); const w=setInterval(()=>{ if(el.dataset.loaded||PAGE!==p){ clearInterval(w); } else if(Date.now()-t0>6000){ clearInterval(w); go(p,true); } },500); return; } if(force||!el.dataset.loaded){ el.innerHTML='<div class="card mute">กำลังโหลด…</div>'; LOADERS[p](el).then(()=>el.dataset.loaded=1).catch(e=>{ if(e.message!=='expired') el.innerHTML='<div class="card msg err" style="display:block">โหลดไม่ได้: '+esc(e.message)+'</div>'; }); } }
/* dialog ของแอปเอง (prompt/confirm/alert ใช้ไม่ได้ในแอปที่เพิ่มไว้หน้าจอโฮม iOS) */
let _dlg=null;
function ask(o){ return new Promise(res=>{ _dlg=res; const d=$('dlg'); $('dlgT').textContent=o.title||''; $('dlgM').textContent=o.text||''; const inp=$('dlgI'); inp.style.display=o.input?'block':'none'; inp.value=o.def||''; inp.inputMode=o.numeric?'numeric':'text'; $('dlgOk').textContent=o.ok||'ตกลง'; $('dlgNo').style.display=o.noCancel?'none':'inline-block'; d.style.display='flex'; if(o.input) setTimeout(()=>inp.focus(),100); }); }
function dlgEnd(ok){ $('dlg').style.display='none'; const r=_dlg; _dlg=null; if(r) r(ok?($('dlgI').style.display==='none'?true:$('dlgI').value):null); }
const confirmA=(text,title)=>ask({title:title||'ยืนยัน',text,ok:'ยืนยัน'}); const promptA=(title,def,numeric)=>ask({title,input:true,def,numeric,ok:'บันทึก'}); const alertA=(text)=>ask({title:'แจ้งเตือน',text,noCancel:true});
function modal(h){ $('modalBody').innerHTML='<button class="x" onclick="closeModal()">×</button>'+h; $('modal').style.display='flex'; } function closeModal(){ $('modal').style.display='none'; }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ const s=Math.min(1,1280/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.85)); }; img.onerror=rej; img.src=url; }); }
const monthSel=(id,cur,fn)=>'<select id="'+id+'" onchange="'+fn+'">'+INIT.months.map(m=>'<option'+(m===cur?' selected':'')+'>'+m+'</option>').join('')+'</select>';
const shopSel=(id,cur)=>'<select id="'+id+'">'+INIT.shops.map(s=>'<option'+(s===cur?' selected':'')+'>'+s+'</option>').join('')+'</select>';

/* ---------- วันนี้ ---------- */
async function pToday(el,date){ const d=await api({api:'today',date:date||TODAY}); if(!d.ok) throw new Error(d.msg); renderToday(el,d); }
function renderToday(el,d){
  let h='<div class="card"><div class="row"><div><h2>📍 '+d.date+'</h2></div><div><input type="date" value="'+d.date+'" onchange="pToday($(\'pg_today\'),this.value)"></div></div>';
  h+='<div class="tiles">'+d.byShop.map(s=>'<div class="tile"><small>'+s.shop+'</small><b>'+s.heads+' หัว</b><small>'+n(s.sales)+' บ. · ค่าแรง '+n(s.wage)+'</small></div>').join('')+'</div></div>';
  const dm=v=>v===null?'<span class="mute">ไม่มี GPS</span>':(v===''||v==null)?'':'<span class="mute">'+v+' ม.</span>'; h+='<div class="card"><h2>เข้างานวันนี้</h2><div class="att"><div class="hd">ช่าง</div><div class="hd">เข้า</div><div class="hd">ออก</div><div class="hd">หมายเหตุ</div>'+d.byShop.map(s=>'<div class="shop">'+s.shop+'</div>'+(s.staff.length?s.staff.map(x=>'<div class="nm">'+x.name+'</div><div><div><b>'+x.tin+'</b><br>'+dm(x.distIn)+'</div></div><div>'+(x.tout?'<div><b>'+x.tout+'</b><br>'+dm(x.distOut)+'</div>':'<span class="mute">—</span>')+'</div><div>'+(x.late>0?'<span class="pill late">สาย '+x.late+' น.</span>':'')+(x.distIn!==''&&x.distIn!==null&&x.distIn>150?' <span class="pill no">นอกพื้นที่</span>':'')+'</div>').join(''):'<div class="mute" style="grid-column:1/-1;padding:4px 0 8px">— ยังไม่มีใครกดเข้างาน</div>')).join('')+'</div>'+(d.notYet.length?'<div style="margin-top:6px">ยังไม่กด: '+d.notYet.map(x=>'<span class="pill no">'+x+'</span>').join('')+'</div>':'')+'</div>';
  h+='<div class="card"><h2>เดือนนี้ vs เป้า</h2>'+d.mtd.map(s=>{const pc=s.target?Math.min(100,Math.round(s.heads/s.target*100)):0;return '<div style="margin-bottom:6px"><div class="row"><span><b>'+s.shop+'</b> '+s.heads+(s.target?' / '+s.target+' หัว ('+pc+'%)':' หัว (ยังไม่ตั้งเป้า)')+'</span><span style="text-align:right">'+n(s.sales)+' บ.</span></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';}).join('')+'</div>';
  h+='<div class="card"><h2>💵 เงินสดคงเหลือควรมี</h2><table><tr><th>ร้าน</th><th>ตั้งต้น</th><th>+ขายสด</th><th>−จ่าย</th><th>−เก็บไป</th><th>คงเหลือ</th></tr>'+Object.keys(d.cash).map(k=>{const c=d.cash[k];return '<tr><td>'+k+'</td><td>'+n(c.start)+'</td><td>'+n(c.in)+'</td><td>'+n(c.out)+'</td><td>'+n(c.collected)+'</td><td><b>'+n(c.balance)+'</b></td></tr>';}).join('')+'</table><div class="mute">นับตั้งแต่วันที่ตั้งต้นในแผ่น ตั้งค่า (K28:L30) · ต้องกรอกช่อง "เงินสด" ในกรอกยอดถึงจะคำนวณได้</div></div>';
  if(d.pond.length) h+='<div class="card"><h2>💸 โอนรายวันค้าง</h2>'+d.pond.map(p=>'<div>'+p.name+': '+(p.due?'<b style="color:var(--err)">'+p.due+' วัน '+n(p.dueTotal)+' บ.</b> <button class="btn" style="padding:4px 10px;font-size:13px;margin:0" onclick="go(\'pond\',true)">ไปโอน</button>':'<span style="color:var(--ok)">ครบแล้ว ✓</span>')+'</div>').join('')+'</div>';
  if(d.lastCollect.length) h+='<div class="card"><h2>🏦 เก็บเงินสดล่าสุด</h2>'+d.lastCollect.map(c=>'<div>'+c.d+' '+c.shop+' <b>'+n(c.amt)+'</b> '+c.method+' '+(c.who||'')+(c.link?' <a href="'+c.link+'" target="_blank">สลิป</a>':'')+'</div>').join('')+'</div>';
  el.innerHTML=h; }

/* ---------- กรอกยอด ---------- */
let DL={date:TODAY,shop:null};
async function pDaily(el){ DL.shop=DL.shop||INIT.shops[0]; const d=await api({api:'daily_get',date:DL.date,shop:DL.shop}); if(!d.ok) throw new Error(d.msg); renderDaily(el,d); }
function renderDaily(el,d){
  let h='<div class="card"><div class="row"><input type="date" id="dlDate" value="'+d.date+'" onchange="DL.date=this.value;go(\'daily\',true)"></div><div class="seg">'+INIT.shops.map(s=>'<button class="'+(s===d.shop?'on':'')+'" onclick="DL.shop=\''+s+'\';go(\'daily\',true)">'+s+'</button>').join('')+'</div>';
  const SN=d.shopNote; if(SN){ const done=d.rows.some(r=>r.exists), diff=SN.cash!=null&&d.cashAt!=null?SN.cash-d.cashAt:null;
    h+='<div class="ncard"><div class="nrow"><b>📝 สรุปจาก '+esc(SN.name)+'</b><span class="mute">'+SN.at+'</span></div>'
     +(SN.cash!=null?'<div class="nck '+(!done?'':diff===0?'ok':'bad')+'">💵 เงินสดนับได้ <b>'+n(SN.cash)+'</b>'+(!done?' · <span class="mute">กรอกยอดแล้วกดบันทึก ระบบจะเทียบให้</span>':' · ระบบควรมี '+n(d.cashAt)+(diff===0?' ✓ ตรง':' → '+(diff<0?'ขาด ':'เกิน ')+n(Math.abs(diff))))+'</div>':'')
     +(SN.customers!=null?'<div class="nck" id="ncHeads" data-c="'+SN.customers+'"></div>':'')
     +(SN.newC!=null?'<div class="mute" style="margin-top:4px">ลูกค้าใหม่ '+SN.newC+' · ประจำ '+SN.regC+(SN.sources?' · มาจาก: '+esc(SN.sources):'')+'</div>':'')
     +(SN.note?'<div style="color:#e55;font-size:12.5px;margin-top:4px">⚠️ '+esc(SN.note)+'</div>':'')
     +'<details><summary class="mute">ดูข้อความเต็ม</summary><pre class="npre">'+esc(SN.text)+'</pre></details></div>'; }
  const B=d.books||[]; if(B.length||!SN) h+=B.length?'<a href="#" class="bkbar" onclick="bookList();return false"><span>📒 รูปสมุดร้าน'+esc(d.shop)+' ('+B.length+' รูป)</span><span class="mute">ส่งโดย '+[...new Set(B.map(x=>x.name))].map(esc).join(', ')+' ›</span></a>':'<div class="bkbar none">📒 ยังไม่มีรูปสมุดร้าน'+esc(d.shop)+' — ให้ช่างถ่ายส่งเข้า LINE OA</div>';
  h+='<div id="dlTable">'+d.rows.map(r=>'<div class="dl" data-name="'+esc(r.name)+'"><div class="dlh"><b>'+esc(r.name)+'</b>'+(r.punched?' <span class="pill">เข้างาน</span>':'')+(r.main?'':' <span class="mute">(ร้านอื่น)</span>')+'</div>'
    +'<div class="dlg"><label>หัว<input inputmode="numeric" class="h" value="'+r.heads+'" oninput="calcRow(this)"></label><label>เงินสด<input inputmode="numeric" class="c" value="'+r.cash+'" oninput="calcRow(this)"></label><label>โอน<input inputmode="numeric" class="t" value="'+r.transfer+'" oninput="calcRow(this)"></label><label>รวม<input class="s tot" value="'+(r.sales||'')+'" readonly tabindex="-1"></label></div>'
    +'<div class="dlf"><span>ค่าแรง <b class="w">'+(r.exists?n(r.paid):'-')+'</b></span><label>แก้ค่าแรง <input inputmode="numeric" class="o" value="'+r.over+'" placeholder="อัตโนมัติ"></label></div>'
    +'<div class="slp" data-st="'+(r.slips||[]).reduce((a,x)=>a+(x.amount||0),0)+'" data-sn="'+(r.slips||[]).length+'" data-su="'+(r.slips||[]).filter(x=>x.amount==null).length+'" data-tip="'+(r.tips||0)+'" onclick="slipList(\''+esc(r.name)+'\')"></div></div>').join('')+'</div>';
  h+='<div class="mute" style="margin:6px 0">กรอก หัว · เงินสด · โอน → "รวม" และค่าแรงคำนวณให้เอง (50% ของรวม หรือ 200/หัว Kraft ไม่ต่ำกว่าขั้นต่ำ) · ช่อง "แก้ค่าแรง" ใช้เมื่อจะจ่ายต่างจากสูตร · ลบ: ล้างทุกช่องให้ว่างแล้วบันทึก</div>';
  h+='<button class="btn ok w" id="dlSave" onclick="saveDaily()">บันทึก '+d.shop+' '+d.date+'</button><div id="dlMsg" class="msg"></div></div>';
  if(d.cash){ const c=d.cash; h+='<div class="card"><h2>💵 เงินสดร้าน'+d.shop+' ควรมีตอนนี้</h2><div style="font-size:26px;font-weight:700">'+n(c.balance)+' บาท</div><div class="mute" style="margin-top:4px">ตั้งต้น '+n(c.start)+(c.from?' ('+c.from.slice(5)+')':'')+' + ขายเงินสด '+n(c.in)+' − ช่างหยิบ/จ่ายจากเงินสด '+n(c.out)+' − เก็บไปแล้ว '+n(c.collected)+'</div><div class="mute" style="margin-top:4px">นับเงินในลิ้นชักให้ตรงตัวเลขนี้ ถ้าไม่ตรง = มีคนหยิบเงินแล้วไม่ได้บันทึก หรือกรอกเงินสด/โอนผิด</div></div>'; }
  el.innerHTML=h; DL.data=d; document.querySelectorAll('#dlTable [data-name]').forEach(slipCheck); noteHeads(); }
function noteHeads(){ const e=document.getElementById('ncHeads'); if(!e) return; const c=+e.dataset.c; const hs=[...document.querySelectorAll('#dlTable .h')].reduce((a,i)=>a+(Number(i.value)||0),0); e.className='nck '+(hs===c?'ok':hs?'bad':''); e.innerHTML='👥 ลูกค้า <b>'+c+'</b> คน · กรอกหัวรวม '+hs+(hs===c?' ✓ ตรง':hs?' → ต่าง '+Math.abs(hs-c):''); }
function slipCheck(card){ const e=card.querySelector('.slp'); if(!e) return; const st=+e.dataset.st, sn=+e.dataset.sn, su=+e.dataset.su, tip=+e.dataset.tip; const tv=Number(card.querySelector('.t').value)||0; const exp=tv+tip;
  if(!sn&&!tv){ e.innerHTML=''; e.className='slp'; return; }
  let cls='slp', msg;
  if(!sn) { cls+=' bad'; msg='⚠ โอน '+n(tv)+' แต่ยังไม่มีสลิป'; }
  else if(su) { cls+=' warn'; msg='🧾 สลิป '+sn+' ใบ · อ่านยอดไม่ได้ '+su+' ใบ — แตะเพื่อดู/ใส่ยอด'; }
  else if(st===exp) { cls+=' ok'; msg='✓ สลิป '+sn+' ใบ '+n(st)+' ตรง'+(tip?' (โอน '+n(tv)+' + ทิป '+n(tip)+')':'กับโอน'); }
  else { cls+=' bad'; msg='⚠ สลิป '+sn+' ใบ รวม '+n(st)+' แต่โอน'+(tip?'+ทิป':'')+' '+n(exp)+' → สลิป'+(st<exp?'ขาด ':'เกิน ')+n(Math.abs(st-exp)); }
  e.className=cls; e.innerHTML=msg+(sn?' <span class="mute">›</span>':''); }
function slipList(name){ const r=(DL.data.rows||[]).find(x=>x.name===name); if(!r||!(r.slips||[]).length) return;
  modal('<h2>🧾 สลิปโอน '+esc(name)+' · '+DL.data.shop+' '+DL.data.date.slice(5)+'</h2>'+r.slips.map(x=>'<div class="row" style="align-items:center;border-bottom:1px solid var(--line);padding:8px 0"><div>'+x.at+' · <b>'+(x.amount==null?(x.note==='รออ่าน'?'⏳ กำลังอ่าน':'อ่านไม่ได้'):n(x.amount)+' บ.')+'</b>'+(x.read!=null&&x.amount!==x.read?' <span class="mute">(อ่านได้ '+n(x.read)+')</span>':'')+(x.note&&x.note!=='รออ่าน'?'<div style="color:#d33;font-size:12px">⚠️ '+esc(x.note)+'</div>':'')+'</div><div style="text-align:right"><a href="'+x.link+'" target="_blank">ดูรูป</a> · <a href="#" onclick="slipFix('+x.row+','+(x.amount==null?'\'\'':x.amount)+');return false">แก้ยอด</a></div></div>').join('')+(r.tips?'<div class="mute" style="margin-top:8px">ทิปโอนที่ช่างบันทึก '+n(r.tips)+' บ. (สลิปรวมทิปได้)</div>':'')); }
function bookList(){ const B=DL.data.books||[]; if(!B.length) return; const id=l=>(String(l).match(/[-\w]{25,}/)||[''])[0];
  modal('<h2>📒 สมุดร้าน'+esc(DL.data.shop)+' · '+DL.data.date.slice(5)+'</h2>'+B.map(x=>'<div style="margin-bottom:12px"><div class="mute">ส่งโดย '+esc(x.name)+' · '+x.at+' · <a href="'+x.link+'" target="_blank">เปิดรูปเต็ม</a></div><a href="'+x.link+'" target="_blank"><img class="bkimg" loading="lazy" src="https://drive.google.com/thumbnail?id='+id(x.link)+'&sz=w1200"></a></div>').join('')+'<div class="mute">ดูรูปแล้วกรอก หัว / เงินสด / โอน ของแต่ละคนด้านล่าง</div>'); }
async function slipFix(row,cur){ const v=await promptA('ยอดในสลิป (บาท)',cur===''?'':cur,true); if(v==null) return; if(v!==''&&!/^\d+(\.\d+)?$/.test(String(v).trim())){ await alertA('ใส่ตัวเลข'); return; } const r=await api({api:'slip_fix',row,amount:String(v).trim(),date:DL.data.date,shop:DL.data.shop}); if(r.ok){ closeModal(); renderDaily($('pg_daily'),r.data); } else await alertA(r.msg||'ไม่สำเร็จ'); }
function calcRow(inp){ const tr=inp.closest('[data-name]'); const S=tr.querySelector('.s'), c=tr.querySelector('.c'), t=tr.querySelector('.t'); const cv=Number(c.value)||0, tv=Number(t.value)||0;
  if(c.value!==''||t.value!=='') S.value=cv+tv; slipCheck(tr); noteHeads();                                     // รวม = เงินสด + โอน
  const w=tr.querySelector('.w'); if(w){ const sv=Number(S.value)||0; const rule=(INIT.rules||{})[DL.shop], b=(INIT.barbers||[]).find(x=>x.name===tr.dataset.name); if(rule&&b){ const hv=Number(tr.querySelector('.h').value)||0; const base=rule.method==='ต่อหัว'?hv*rule.rate:sv*rule.rate; const wg=Math.max(base,b.min||0); w.textContent=(hv||sv)?'≈'+Math.round(wg).toLocaleString():''; } } }
async function saveDaily(){ const rows=[...document.querySelectorAll('#dlTable [data-name]')].map(tr=>({name:tr.dataset.name,heads:tr.querySelector('.h').value,sales:tr.querySelector('.s').value,cash:tr.querySelector('.c').value,transfer:tr.querySelector('.t').value,over:tr.querySelector('.o').value,remove:true}));
  $('dlSave').disabled=true; msg('dlMsg','กำลังบันทึก…','warn'); try{ const r=await api({api:'daily_save',date:DL.date,shop:DL.shop,rows}); if(!r.ok){msg('dlMsg',r.msg,'err');$('dlSave').disabled=false;return;} renderDaily($('pg_daily'),r.data); msg('dlMsg',r.msg+' ✓','ok'); $('pg_today').dataset.loaded=''; }catch(e){ msg('dlMsg','บันทึกไม่ได้','err'); $('dlSave').disabled=false; } }

/* ---------- รายจ่าย ---------- */
let EXP_YM=TODAY.slice(0,7);
async function pExp(el){ const d=await api({api:'expense_list',ym:EXP_YM}); if(!d.ok) throw new Error(d.msg);
  const bOpt='<option value="">—</option>'+INIT.barbers.map(b=>'<option>'+b.name+'</option>').join('');
  let h='<div class="card"><h2>➕ เพิ่มรายจ่าย</h2><div class="row"><div><label>วันที่</label><input type="date" id="xDate" value="'+TODAY+'"></div><div><label>ร้าน</label>'+shopSel('xShop')+'</div></div>';
  h+='<div class="row"><div><label>ประเภท</label><select id="xType" onchange="$(\'xNameW\').style.display=/เบิก|พิเศษ/.test(this.value)?\'block\':\'none\'">'+INIT.types.map(t=>'<option>'+t+'</option>').join('')+'</select></div><div><label>จำนวนเงิน</label><input id="xAmt" inputmode="numeric"></div></div>';
  h+='<div id="xNameW" style="display:none"><label>ช่าง (เบิก/ค่าแรงพิเศษ)</label><select id="xName">'+bOpt+'</select></div><label>รายละเอียด</label><input id="xDetail" placeholder="เช่น ค่าไฟ ต.ค. / น้ำดื่ม 2 แพ็ค">';
  h+='<label>จ่ายจาก</label><div class="seg" id="xFrom"><button class="on" data-v="โอน" onclick="segPick(this)">โอน / แอดมินจ่าย</button><button data-v="เงินสดร้าน" onclick="segPick(this)">เงินสดในร้าน</button></div><label>รูปใบเสร็จ (ถ้ามี)</label><input type="file" id="xImg" accept="image/*">';
  h+='<button class="btn ok w" id="xBtn" onclick="addExp()">บันทึกรายจ่าย</button><div id="xMsg" class="msg"></div></div>';
  h+='<div class="card"><div class="row"><h2>รายการเดือน</h2>'+monthSel('xYm',EXP_YM,'EXP_YM=this.value;go(\'exp\',true)')+'</div><div class="scroll"><table><tr><th>วันที่</th><th>ร้าน</th><th>ประเภท</th><th>จำนวน</th><th>รายละเอียด</th></tr>'+d.rows.map(r=>'<tr><td>'+r.d.slice(5)+'</td><td>'+r.shop+'</td><td>'+r.type+(r.name?' '+r.name:'')+'</td><td>'+n(r.amt)+'</td><td style="text-align:left;white-space:normal;max-width:160px">'+esc(r.detail)+(r.link?' <a href="'+r.link+'" target="_blank">📎</a>':'')+(r.from==='เงินสดร้าน'?' <span class="pill">สด</span>':'')+'</td></tr>').join('')+'</table></div></div>';
  el.innerHTML=h; }
function segPick(b){ [...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b)); }
async function addExp(){ $('xBtn').disabled=true; msg('xMsg','กำลังบันทึก…','warn'); try{ let image=''; const f=$('xImg').files[0]; if(f) image=await shrink(f); const from=document.querySelector('#xFrom .on').dataset.v;
  const r=await api({api:'expense_add',date:$('xDate').value,shop:$('xShop').value,type:$('xType').value,name:$('xName').value,amount:$('xAmt').value,detail:$('xDetail').value,from,image}); $('xBtn').disabled=false; msg('xMsg',r.msg,r.ok?'ok':'err'); if(r.ok){ $('xAmt').value='';$('xDetail').value='';$('xImg').value=''; setTimeout(()=>go('exp',true),800); $('pg_today').dataset.loaded=''; } }catch(e){ $('xBtn').disabled=false; msg('xMsg','บันทึกไม่ได้','err'); } }

/* ---------- โอนรายวัน (ปอน) ---------- */
async function pPond(el){ const d=await api({api:'pond'}); if(!d.ok) throw new Error(d.msg); renderPond(el,d); }
function renderPond(el,d){ if(!d.barbers.length){ el.innerHTML='<div class="card mute">ไม่มีช่างที่จ่ายรายวัน (ตั้งที่ ตั้งค่า คอลัมน์ "จ่ายรายวัน")</div>'; return; }
  const dueDate=new Date(Date.now()-2*86400000); const dueKey=todayStr(dueDate);
  el.innerHTML=d.barbers.map(b=>{ const dueMap={}; b.due.forEach(x=>dueMap[x.d]=1); const todayRow=b.rows.find(r=>r.d===dueKey);
    let h='<div class="card"><h2>💸 '+b.name+'</h2>';
    h+='<div class="tile" style="text-align:left;margin-bottom:8px"><small>วันนี้ '+TODAY.slice(5)+' ต้องโอนยอดของวันที่ '+dueKey.slice(5)+'</small><b>'+(todayRow?(todayRow.paid?'โอนแล้ว ✓':n(todayRow.wage)+' บาท'):'ยังไม่ได้กรอกยอดวันนั้น')+'</b>'+(b.due.length>1?'<small style="color:var(--err)">+ ค้างเก่าอีก '+(b.due.length-1)+' วัน รวมค้างทั้งหมด '+n(b.dueTotal)+' บาท</small>':'')+'</div>';
    h+='<div class="mute" style="margin-bottom:6px">ติ๊ก ✓ วันที่โอนจริง (ติ๊กได้หลายวัน) → แนบสลิป → กดบันทึก · กดผิดกด "ยกเลิก" ท้ายรายการได้</div>';
    h+='<table><tr><th>โอน?</th><th>วันที่ตัด</th><th>ร้าน</th><th>หัว</th><th>ค่าแรง</th><th>สถานะ</th></tr>'+b.rows.slice(0,20).map(r=>{ const isDue=!!dueMap[r.d]; const canPay=!r.paid&&r.wage>0; const st=r.paid?'<span style="color:var(--ok)">โอนแล้ว '+r.paidOn.slice(5)+'</span> <a href="#" onclick="pondUnpay(\''+esc(b.name)+'\',\''+r.d+'\');return false" class="mute" style="font-size:11px">ยกเลิก</a>':isDue?'<b>ครบกำหนด</b>':r.wage>0?'<span class="mute">รอถึงกำหนด</span>':'<span class="mute">-</span>';
      return '<tr><td>'+(canPay?'<input type="checkbox" class="pd" value="'+r.d+'" data-w="'+r.wage+'" onchange="pondSum(this)" style="width:22px;height:22px">':r.paid?'<input type="checkbox" checked disabled style="width:22px;height:22px;opacity:.4">':'')+'</td><td>'+r.d.slice(5)+'</td><td>'+r.shop+'</td><td>'+r.heads+'</td><td>'+n(r.wage)+'</td><td>'+st+'</td></tr>'; }).join('')+'</table>';
    h+='<label>รูปสลิปโอน (ถ้ามี)</label><input type="file" id="pdImg_'+b.name+'" accept="image/*"><button class="btn ok w" onclick="pondPay(this,\''+esc(b.name)+'\')"><span class="sum">บันทึกว่าโอนแล้ว</span> + แจ้ง'+b.name+'</button><div id="pdMsg_'+b.name+'" class="msg"></div></div>'; return h; }).join(''); }
function pondSum(cb){ const card=cb.closest('.card'); const t=[...card.querySelectorAll('.pd:checked')].reduce((a,c)=>a+(Number(c.dataset.w)||0),0); card.querySelector('.sum').textContent=t?'บันทึกว่าโอนแล้ว '+n(t)+' บ.':'บันทึกว่าโอนแล้ว'; }
async function pondUnpay(name,d){ if(!(await confirmA('ยกเลิกรายการโอน '+name+' วันที่ '+d+'?'))) return; const r=await api({api:'pond_unpay',name,date:d}); if(r.ok&&r.data) renderPond($('pg_pond'),r.data); else msg('pdMsg_'+name,r.msg||'ไม่สำเร็จ','err'); $('pg_today').dataset.loaded=''; }
async function pondPay(btn,name){ const card=btn.closest('.card'); const dates=[...card.querySelectorAll('.pd:checked')].map(c=>c.value); if(!dates.length){ msg('pdMsg_'+name,'ติ๊กวันที่โอนก่อน','warn'); return; } btn.disabled=true; msg('pdMsg_'+name,'กำลังบันทึก…','warn');
  try{ let image=''; const f=$('pdImg_'+name).files[0]; if(f) image=await shrink(f); const r=await api({api:'pond_paid',name,dates,image}); if(!r.ok){msg('pdMsg_'+name,r.msg,'err');btn.disabled=false;return;} renderPond($('pg_pond'),r.data); $('pg_today').dataset.loaded=''; }catch(e){ msg('pdMsg_'+name,'บันทึกไม่ได้','err'); btn.disabled=false; } }

/* ---------- รายเดือน ---------- */
let M_YM=TODAY.slice(0,7);
async function pMonth(el){ const d=await api({api:'month',ym:M_YM}); if(!d.ok) throw new Error(d.msg);
  let h='<div class="card"><div class="row"><h2>📊 รายเดือน</h2>'+monthSel('mYm',M_YM,'M_YM=this.value;go(\'month\',true)')+'</div>';
  h+='<div class="tiles"><div class="tile"><small>ยอดขาย</small><b>'+n(d.total.sales)+'</b></div><div class="tile"><small>ค่าแรง+รายจ่าย</small><b>'+n(d.total.wage+d.total.exp)+'</b></div><div class="tile"><small>กำไร</small><b style="color:'+(d.total.profit>=0?'var(--ok)':'var(--err)')+'">'+n(d.total.profit)+'</b></div></div></div>';
  h+='<div class="card"><h2>ต่อร้าน</h2><div class="scroll"><table><tr><th>ร้าน</th><th>หัว/เป้า</th><th>ยอดขาย</th><th>ค่าแรง</th><th>รายจ่าย</th><th>กำไร</th></tr>'+d.byShop.map(s=>'<tr><td>'+s.shop+(ME.role==='owner'?' <a href="#" onclick="setTarget(\''+s.shop+'\','+(s.target||0)+');return false" style="font-size:11px">'+(s.target?'แก้เป้า':'ตั้งเป้า')+'</a>':'')+'</td><td>'+s.heads+' / '+(s.target?'<b>'+s.target+'</b>'+(s.heads>=s.target?' ✓':''):'<span class="mute">ยังไม่ตั้ง</span>')+'</td><td>'+n(s.sales)+'</td><td>'+n(s.wage)+'</td><td>'+n(s.expTotal)+'</td><td><b>'+n(s.profit)+'</b></td></tr>').join('')+'</table></div>';
  h+='<div class="mute" style="margin-top:6px">รายจ่าย: '+d.byShop.map(s=>s.shop+' → '+Object.keys(s.expenses).map(k=>k+' '+n(s.expenses[k])).join(', ')).join(' | ')+'</div></div>';
  (d.customers||[]).forEach(c=>{ const mx=Math.max(1,...c.sources.map(s=>s.n)), pn=c.newC+c.regC?Math.round(c.newC*100/(c.newC+c.regC)):0;
    h+='<div class="card"><h2>👥 ลูกค้า '+esc(c.shop)+' · '+M_YM+'</h2><div class="tiles"><div class="tile"><small>ลูกค้าทั้งหมด</small><b>'+c.total+'</b></div><div class="tile"><small>ลูกค้าใหม่</small><b>'+c.newC+'</b></div><div class="tile"><small>ลูกค้าประจำ</small><b>'+c.regC+'</b></div></div>'
     +'<div class="mute" style="margin:6px 0 10px">ลูกค้าใหม่ '+pn+'% · ข้อมูลจาก '+c.days+' วันที่ช่างส่งสรุป'+(c.noDetail?' · ไม่ได้แยกรายคน '+c.noDetail+' คน':'')+'</div>'
     +(c.sources.length?'<div style="font-weight:600;margin-bottom:6px">ลูกค้าใหม่มาจากไหน</div>'+c.sources.map(s=>'<div class="srow"><span>'+esc(s.src)+'</span><span class="sbar"><i style="width:'+Math.round(s.n*100/mx)+'%"></i></span><b>'+s.n+'</b></div>').join(''):'<div class="mute">ยังไม่มีข้อมูลที่มา</div>')+'</div>'; });
  h+='<div class="card"><h2>ช่าง</h2><div class="scroll"><table><tr><th>ช่าง</th><th>วัน</th><th>หัว</th><th>ยอด</th><th>ค่าแรง</th><th>สาย</th></tr>'+d.barbers.sort((a,b)=>b.wage-a.wage).map(b=>'<tr><td>'+b.name+'</td><td>'+b.days+'</td><td>'+b.heads+'</td><td>'+n(b.sales)+'</td><td>'+n(b.wage)+'</td><td>'+(b.late?b.late+' ('+b.lateMin+'น.)':'-')+'</td></tr>').join('')+'</table></div></div>';
  h+='<div class="card"><h2>รายวัน (หัว / ยอด)</h2><div class="scroll"><table><tr><th>วันที่</th>'+INIT.shops.map(s=>'<th>'+s+'</th>').join('')+'<th>รวม</th></tr>'+d.days.map(r=>{let t=0,tsales=0;const cells=INIT.shops.map(s=>{const x=r[s]||{heads:0,sales:0};t+=x.heads;tsales+=x.sales;return '<td>'+(x.heads?x.heads+' / '+n(x.sales):'-')+'</td>';}).join('');return '<tr><td>'+r.d.slice(5)+'</td>'+cells+'<td><b>'+t+'</b> / '+n(tsales)+'</td></tr>';}).join('')+'</table></div></div>';
  el.innerHTML=h; }
async function setTarget(shop,cur){
  if(cur&&!(await confirmA('เป้า '+shop+' เดือน '+M_YM+' ตั้งไว้แล้ว '+cur+' หัว\nต้องการเปลี่ยนใช่ไหม?','เป้าตั้งไว้แล้ว'))) return;
  const v=await promptA((cur?'แก้เป้าหัว ':'ตั้งเป้าหัว ')+shop+' เดือน '+M_YM,cur||'',true); if(v==null||v==='') return;
  if(!/^\d+$/.test(String(v).trim())){ await alertA('ใส่ตัวเลขจำนวนหัว'); return; }
  const r=await api({api:'target_set',ym:M_YM,shop,val:v.trim()}); msg('gmsg',r.msg,r.ok?'ok':'err'); if(r.ok){ $('pg_today').dataset.loaded=''; $('pg_pay').dataset.loaded=''; go('month',true); } }

/* ---------- เงินเดือน ---------- */
let P_YM=(()=>{const d=new Date();d.setDate(0);const m=todayStr(d).slice(0,7);return m<(BBO.START_YM||'2026-11')?(BBO.START_YM||'2026-11'):m;})();
async function pPay(el){ const d=await api({api:'payroll',ym:P_YM}); if(!d.ok) throw new Error(d.msg);
  let h='<div class="card"><div class="row"><h2>💰 เงินเดือน</h2>'+monthSel('pYm',P_YM,'P_YM=this.value;go(\'pay\',true)')+'</div><div class="mute">สถานะ: '+(d.paid?'โอนแล้ว ✓ ส่งสลิปแล้ว':d.closed?'ปิดงวดแล้ว รอโอน':'ยังไม่ปิดงวด')+' · รวมจ่ายวันที่ 2 <b>'+n(d.total)+'</b> บาท</div>';
  h+='<div class="scroll"><table><tr><th>ช่าง</th><th>วัน</th><th>หัว</th><th>ค่าแรง</th><th>โบนัส</th><th>เบิก</th><th>ปกส.</th><th>จ่ายรายวัน</th><th>สุทธิ</th></tr>'+d.people.map(p=>'<tr><td>'+p.name+' <small class="mute">'+p.shop+'</small></td><td>'+p.days+'</td><td>'+p.heads+'</td><td>'+n(p.wage)+'</td><td>'+n(p.bonus)+'</td><td>'+n(p.advance)+'</td><td>'+n(p.sso)+'</td><td>'+n(p.dailyPaid)+'</td><td><b>'+n(p.net)+'</b></td></tr>').join('')+'</table></div>';
  h+='<table style="margin-top:8px"><tr><th>ร้าน</th><th>หัว</th><th>เป้า</th><th>ผล</th></tr>'+d.shops.map(s=>'<tr><td>'+s.shop+'</td><td>'+s.heads+'</td><td>'+s.target+'</td><td>'+s.hit+'</td></tr>').join('')+'</table>';
  if(ME.role==='owner'){ h+='<div class="row">'+(d.closed?'':'<button class="btn warn" onclick="closeMonth()">🔒 ปิดงวด '+P_YM+'</button>')+(d.paid?'':'<button class="btn ok" onclick="paidForm()">✅ โอนแล้ว + ส่งสลิป</button>')+'</div><button class="btn sec w" onclick="barberForm()">👤 จัดการช่าง</button>'; }
  h+='<div id="pMsg" class="msg"></div></div>'; el.innerHTML=h; window.PAY=d; }
async function closeMonth(){ if(!(await confirmA('ปิดงวด '+P_YM+'?\nตรวจว่าผู้จัดการกรอกยอดครบแล้ว','ปิดงวด'))) return; msg('pMsg','กำลังปิดงวด…','warn'); const r=await api({api:'close_month',ym:P_YM}); msg('pMsg',r.msg,r.ok?'ok':'err'); if(r.ok) go('pay',true); }
function paidForm(){ modal('<h2>✅ โอนแล้ว '+P_YM+'</h2><div class="mute">แนบรูปสลิปโอนต่อคน (ไม่บังคับ) → ระบบส่งสลิป PDF + รูปเข้าไลน์ช่าง และเก็บใน Drive</div>'+PAY.people.map(p=>'<label>'+p.name+' — สุทธิ '+n(p.net)+' บาท</label><input type="file" accept="image/*" data-name="'+esc(p.name)+'" class="slipImg">').join('')+'<button class="btn ok w" id="paidBtn" onclick="sendPaid()">ยืนยันโอนแล้ว + ส่งสลิป</button><div id="paidMsg" class="msg"></div>'); }
async function sendPaid(){ $('paidBtn').disabled=true; msg('paidMsg','กำลังสร้างสลิป PDF และส่งไลน์… (ประมาณ 1 นาที)','warn'); const slips={}; for(const inp of document.querySelectorAll('.slipImg')){ if(inp.files[0]) slips[inp.dataset.name]=await shrink(inp.files[0]); }
  try{ const r=await api({api:'paid',ym:P_YM,slips}); msg('paidMsg',r.msg,r.ok?'ok':'err'); if(r.ok) setTimeout(()=>{closeModal();go('pay',true);},2500); }catch(e){ msg('paidMsg','ส่งไม่สำเร็จ: '+e.message,'err'); } $('paidBtn').disabled=false; }
function barberForm(){ modal('<h2>👤 จัดการช่าง</h2><div class="mute">เพิ่มใหม่ หรือพิมพ์ชื่อเดิมเพื่อแก้ไข · ช่างออก: ใส่วันออก</div><label>ชื่อ</label><input id="bName" list="bList"><datalist id="bList">'+INIT.barbers.map(b=>'<option value="'+esc(b.name)+'">').join('')+'</datalist><div class="row"><div><label>ร้านหลัก</label>'+shopSel('bShop')+'</div><div><label>ขั้นต่ำ/วัน</label><input id="bMin" inputmode="numeric" value="500"></div></div><div class="row"><div><label>ประกันสังคม/เดือน</label><input id="bSso" inputmode="numeric" value="0"></div><div><label>PIN (4–6 หลัก)</label><input id="bPin" inputmode="numeric"></div></div><label><input type="checkbox" id="bDaily" style="width:auto"> จ่ายรายวัน (แบบปอน)</label><div class="row"><div><label>วันเข้า</label><input type="date" id="bStart" value="'+TODAY+'"></div><div><label>วันออก (ถ้าออก)</label><input type="date" id="bEnd"></div></div><label><input type="checkbox" id="bUnbind" style="width:auto"> ปลด LINE เดิม (เปลี่ยนเครื่อง/บัญชี)</label><button class="btn ok w" onclick="saveBarber()">บันทึก</button><div id="bMsg" class="msg"></div>'); }
async function saveBarber(){ const p={api:'barber_save',name:$('bName').value,shop:$('bShop').value,min:$('bMin').value,sso:$('bSso').value,pin:$('bPin').value,daily:$('bDaily').checked,start:$('bStart').value,end:$('bEnd').value,unbind:$('bUnbind').checked}; if(p.end&&!(await confirmA('ยืนยันว่า '+p.name+' ออกวันที่ '+p.end+'?'))) return; const r=await api(p); msg('bMsg',r.msg,r.ok?'ok':'err'); if(r.ok){ INIT=await api({api:'init'}); } }
boot();
</script></body></html>
